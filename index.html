<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Peach Project – Trainings-App</title>
<meta name="theme-color" content="#1a1418"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%91%3C/text%3E%3C/svg%3E"/>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"/>
<link rel="manifest" href="manifest.json"/>
<meta name="apple-mobile-web-app-title" content="Peach Project"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
/* Farb-Variablen: Dark Mode (Standard) */
:root{
  color-scheme:dark;
  --bg:#1a1418;--bg-glow:rgba(200,114,154,0.10);
  --header-grad:linear-gradient(160deg,#2e1a28 0%,#1a1418 100%);
  --text:#fff;--text-soft:#bbb;--text-mid:#aaa;--text-dim:#888;--text-faint:#555;--text-ghost:#444;
  --pink:#C8729A;--lilac:#B88CC0;--gold:#e8b860;--green:#7bc47a;--blue:#7aafdf;--red:#d86868;
  --card-hi:rgba(255,255,255,0.055);--card-lo:rgba(255,255,255,0.028);
  --surface:rgba(255,255,255,0.045);--chip-bg:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.08);--border-soft:rgba(255,255,255,0.05);
  --input-bg:rgba(255,255,255,0.075);--input-border:rgba(255,255,255,0.16);
  --drop-bg:#2a1e26;--bar-empty:rgba(255,255,255,0.09);--ring:rgba(255,255,255,0.55);
  --deload-bg:linear-gradient(135deg,#2a1e1a 0%,#1a1a2e 100%);
  --scroll:#3a2a35;
  --sh-header:0 6px 18px rgba(0,0,0,0.35);
  --sh-card:0 4px 14px rgba(0,0,0,0.22);
  --sh-sm:0 3px 10px rgba(0,0,0,0.18);
  --sh-xs:0 2px 6px rgba(0,0,0,0.12);
  --sh-drop:0 8px 32px rgba(0,0,0,0.7);
}
/* Heller Modus */
:root.light{
  color-scheme:light;
  --bg:#faf6f3;--bg-glow:rgba(200,114,154,0.14);
  --header-grad:linear-gradient(160deg,#f6dde9 0%,#faf6f3 100%);
  --text:#2b2127;--text-soft:#4d4148;--text-mid:#675a61;--text-dim:#8d7f86;--text-faint:#a99ba3;--text-ghost:#c4b8be;
  --pink:#b4527e;--lilac:#8d5c97;--gold:#b8862e;--green:#4e9e4d;--blue:#3d7ab5;--red:#c04848;
  --card-hi:rgba(255,255,255,0.95);--card-lo:rgba(255,255,255,0.72);
  --surface:rgba(43,33,39,0.05);--chip-bg:rgba(43,33,39,0.07);
  --border:rgba(43,33,39,0.10);--border-soft:rgba(43,33,39,0.07);
  --input-bg:rgba(43,33,39,0.06);--input-border:rgba(43,33,39,0.20);
  --drop-bg:#fffdfc;--bar-empty:rgba(43,33,39,0.09);--ring:rgba(43,33,39,0.55);
  --deload-bg:linear-gradient(135deg,#fdf2dd 0%,#f4ecf7 100%);
  --scroll:#d9c9d1;
  --sh-header:0 4px 14px rgba(64,37,52,0.10);
  --sh-card:0 4px 14px rgba(64,37,52,0.08);
  --sh-sm:0 3px 10px rgba(64,37,52,0.07);
  --sh-xs:0 2px 6px rgba(64,37,52,0.05);
  --sh-drop:0 8px 32px rgba(64,37,52,0.22);
}
body{background:radial-gradient(900px 420px at 50% -120px,var(--bg-glow),transparent 70%),var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent;transition:background .3s,color .3s;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:4px;}
input,textarea,button{font-family:inherit;}
button{cursor:pointer;transition:transform .12s ease,background .15s,color .15s,border-color .15s,box-shadow .15s;}
button:active{transform:scale(0.96);}
@keyframes fadeSlide{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes dropIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeSlide .25s ease;}
#header{background:var(--header-grad);padding:13px 16px 11px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;box-shadow:var(--sh-header);}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;}
.header-right{display:flex;gap:6px;align-items:center;}
.logo{display:flex;align-items:center;gap:9px;}
.logo-emoji{width:32px;height:32px;image-rendering:pixelated;}
.logo-title{font-weight:800;font-size:18px;letter-spacing:-0.5px;}
.logo-sub{color:var(--pink);font-size:11px;font-weight:500;}
.theme-btn{width:34px;height:34px;border-radius:50%;background:var(--chip-bg);border:1px solid var(--border);font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;}
@media(max-width:430px){.logo-sub{display:none}.logo-title{font-size:16px}.tab-btn{padding:8px 12px}}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.tab-btn{padding:8px 15px;border-radius:10px;border:none;font-size:13px;font-weight:600;}
.tab-btn.active{background:#C8729A;color:#fff;box-shadow:0 2px 10px rgba(200,114,154,0.35);}
.tab-btn.inactive{background:var(--chip-bg);color:var(--text-dim);}
.cycle-btn{padding:7px 13px;border-radius:10px;font-size:12px;font-weight:600;border:1px solid var(--input-border);background:transparent;color:var(--text-dim);}
.cycle-btn.active{border-color:var(--lilac);background:rgba(184,140,192,0.15);color:var(--lilac);}
.week-nav{margin-left:auto;display:flex;align-items:center;gap:6px;}
.week-arrow{width:34px;height:34px;border-radius:50%;background:var(--chip-bg);border:none;color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;}
.week-label{font-size:14px;font-weight:700;min-width:62px;text-align:center;}
#content{padding:16px 16px 40px;max-width:680px;margin:0 auto;}
.week-progress{background:linear-gradient(180deg,var(--card-hi),var(--card-lo));border:1px solid var(--border-soft);border-radius:12px;padding:11px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh-sm);}
.wp-bar-wrap{flex:1;height:6px;border-radius:3px;background:var(--bar-empty);overflow:hidden;}
.wp-bar{height:100%;border-radius:3px;transition:width .5s;}
.day-card{background:linear-gradient(180deg,var(--card-hi),var(--card-lo));border-radius:16px;margin-bottom:12px;overflow:visible;border:1px solid var(--border);box-shadow:var(--sh-card);}
.day-header{width:100%;background:none;border:none;padding:15px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--text);text-align:left;border-radius:16px;}
.day-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.day-count{font-size:11px;font-weight:700;padding:4px 10px;border-radius:12px;background:var(--chip-bg);color:var(--text-dim);white-space:nowrap;transition:background .3s,color .3s;}
.day-count.part{background:rgba(200,114,154,0.16);color:var(--pink);}
.day-count.full{background:rgba(123,196,122,0.16);color:var(--green);}
.day-chevron{color:var(--text-dim);font-size:12px;}
.day-body{padding:0 12px 12px;}
.day-body.anim{animation:fadeSlide .25s ease;}
.ex-row{background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh-xs);}
.ex-row-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.cat-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px;white-space:nowrap;letter-spacing:0.5px;text-transform:uppercase;}
.light .cat-badge{filter:brightness(0.72) saturate(1.25);}
.light .pbadge{filter:brightness(0.8) saturate(1.2);}
.done-chip{width:20px;height:20px;border-radius:50%;background:rgba(123,196,122,0.18);border:1px solid rgba(123,196,122,0.6);color:var(--green);font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.picker-wrap{flex:1;min-width:140px;position:relative;}
.pick-btn{width:100%;min-height:40px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:9px;color:var(--text-faint);font-size:14px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:6px;text-align:left;}
.pick-btn.has-val{color:var(--text);}
.pick-btn-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.pick-btn-arr{color:var(--text-faint);font-size:10px;flex-shrink:0;}
.dropdown{position:absolute;left:0;right:0;z-index:200;background:var(--drop-bg);border-radius:10px;box-shadow:var(--sh-drop);overflow:hidden;}
.dropdown.anim{animation:dropIn .18s ease;}
.drop-search{padding:8px 8px 4px;}
.drop-search input{width:100%;background:var(--input-bg);border:1px solid var(--input-border);border-radius:8px;color:var(--text);font-size:16px;padding:8px 10px;outline:none;}
.drop-list{max-height:240px;overflow-y:auto;}
.drop-opt{padding:11px 12px;font-size:14px;color:var(--text-soft);cursor:pointer;border-bottom:1px solid var(--border-soft);}
.drop-opt:hover{background:var(--surface);}
.drop-opt.sel{font-weight:600;}
.drop-empty-opt{color:var(--text-dim);border-bottom:1px solid var(--border);}
.drop-no-results{padding:10px 12px;color:var(--text-faint);font-size:12px;}
.pbadge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:12px;white-space:nowrap;}
.ex-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.sets-info{color:var(--text-dim);font-size:12px;}
.w-wrap{display:flex;align-items:center;gap:6px;}
.w-label{color:var(--text-dim);font-size:12px;}
.w-input{width:78px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:8px;color:var(--text);font-size:16px;font-weight:600;padding:7px 8px;outline:none;}
.w-input:focus,.rep-inp:focus,.drop-search input:focus,.tip-ta:focus,.set-input:focus{border-color:#C8729A!important;}
.setting-row{display:flex;align-items:center;gap:7px;margin-bottom:8px;}
.set-lbl{color:var(--text-dim);font-size:13px;flex-shrink:0;cursor:default;}
.set-input{flex:1;min-width:0;background:var(--input-bg);border:1px solid var(--input-border);border-radius:8px;color:var(--text);font-size:16px;padding:7px 9px;outline:none;}
.reps-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.rep-col{display:flex;flex-direction:column;align-items:center;gap:2px;}
.rep-lbl{color:var(--text-faint);font-size:10px;}
.rep-inp{width:46px;text-align:center;background:var(--input-bg);border-radius:8px;color:var(--text);font-size:16px;font-weight:600;padding:8px 2px;outline:none;}
.rep-prev{color:var(--text-faint);font-size:10px;}
.add-set-btn{width:36px;height:36px;border-radius:50%;background:var(--chip-bg);border:1px dashed var(--input-border);color:var(--text-dim);font-size:18px;display:flex;align-items:center;justify-content:center;}
.phint{margin-top:8px;font-size:11px;color:var(--text-dim);}
.tip-toggle{background:none;border:none;color:var(--text-dim);font-size:12px;font-weight:600;padding:6px 0 2px;display:flex;align-items:center;gap:5px;margin-top:4px;}
.tip-toggle.open{color:var(--pink);}
.tip-i{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--text-faint);font-size:9px;font-weight:800;}
.tip-toggle.open .tip-i{border-color:var(--pink);color:var(--pink);}
.tip-custom{color:var(--lilac);font-size:10px;}
.tip-panel{margin-top:6px;background:var(--surface);border-radius:10px;border:1px solid var(--border);padding:10px 12px;animation:fadeSlide .2s ease;}
.tip-text{color:var(--text-soft);font-size:12px;line-height:1.7;white-space:pre-wrap;}
.tip-note{margin-top:9px;padding-top:9px;border-top:1px dashed var(--border);}
.tip-note-lbl{color:var(--lilac);font-size:11px;font-weight:700;margin-bottom:4px;}
.tip-ta{margin-top:4px;}
.tip-edit-btn{margin-top:8px;background:none;border:none;color:var(--text-dim);font-size:12px;padding:6px 0;}
.tip-ta{width:100%;background:var(--input-bg);border:1px solid var(--input-border);border-radius:7px;color:var(--text-soft);font-size:16px;line-height:1.6;padding:8px 10px;resize:vertical;outline:none;}
.tip-acts{display:flex;gap:8px;margin-top:7px;}
.tip-save{background:#C8729A;border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:700;padding:8px 16px;}
.tip-cancel{background:var(--chip-bg);border:none;border-radius:8px;color:var(--text-mid);font-size:12px;padding:8px 13px;}
.tip-reset{background:none;border:none;color:var(--text-dim);font-size:12px;padding:8px;margin-left:auto;}
.ov-title{font-size:18px;font-weight:700;margin-bottom:6px;color:var(--pink);}
.ov-sub{color:var(--text-dim);font-size:13px;margin-bottom:20px;line-height:1.6;}
.ov-day{margin-bottom:24px;}
.ov-day-lbl{font-weight:700;font-size:13px;color:var(--lilac);margin-bottom:10px;}
.ov-ex{background:linear-gradient(180deg,var(--card-hi),var(--card-lo));border:1px solid var(--border-soft);border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--sh-sm);}
.ov-bars{display:flex;align-items:flex-end;gap:3px;height:40px;}
.ov-bar{flex:1;border-radius:3px 3px 0 0;transition:height .3s;min-height:2px;}
.hidden{display:none!important;}
</style>
</head>
<body>
<div style="max-width:680px;margin:0 auto;">
<div id="header">
  <div class="header-top">
    <div class="logo">
      <svg class="logo-emoji" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">

        <rect x="6" y="9" width="8" height="1" fill="#ff8c69"/>
        <rect x="3" y="10" width="3" height="1" fill="#ffb347"/>

      <div><div class="logo-title">Peach Project</div><div class="logo-sub">Trainings-App</div></div>
    </div>
    <div class="header-right">
      <button class="tab-btn active" id="btn-training" onclick="setView('training')">Training</button>
      <button class="tab-btn inactive" id="btn-overview" onclick="setView('overview')">Übersicht</button>
      <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Hell/Dunkel umschalten">☀️</button>
    </div>
  </div>
  <div class="controls">
    <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center;">
      <button class="cycle-btn active" id="cycle-cycle1" onclick="setCycle('cycle1')">Zyklus 1</button>
      <button class="cycle-btn" id="cycle-cycle2" onclick="setCycle('cycle2')">Zyklus 2</button>
      <button class="cycle-btn" id="cycle-cycle3" onclick="setCycle('cycle3')">Zyklus 3</button>
    </div>
    <div class="week-nav">
      <button class="week-arrow" onclick="changeWeek(-1)">&#8249;</button>
      <span class="week-label" id="week-label">Woche 1 / 12</span>
      <button class="week-arrow" onclick="changeWeek(1)">&#8250;</button>
    </div>
  </div>
</div>
<div id="content">
  <div id="view-training"></div>
  <div id="view-overview" class="hidden"></div>
</div>
</div>
<script>
const EXERCISES={

"Glute Med":["Kabel Abduktion Stehend","Kabel Abduktion Liegend","Kabel Abduktion Schrägbank","Abduktionsmaschine","Pelvic Drop","Abduktionsmaschine stehend","Fire Hydrants Kabel","3D Abduktor Maschine"],

"Rücken":["LH Rudern","KH Rudern","KH Rudern (breit)","Rudern Kabel (eng)","Rudern Kabel (breit)","Rudermaschine (Panatta)","Rudermaschine (Precor)","Latzug (eng)","Latzug (breit)","Latzug Maschine (Panatta)","Latzug Maschine (Precor)","Überzug am Kabel","T Bar Rudern (neutral)","T Bar Rudern (breit)","Assistierter Klimmzug (eng)","Assistierter Klimmzug (breit)","Face Pull Kabel","Straight-Arm Pulldown","Einarmiger Latzug Kabel","Diverging Low Row"],
"Brust":["LH Bankdrücken","KH Bankdrücken","Bankdrücken Multipresse","Bankdrücken Maschine","LH Schrägbankdrücken","KH Schrägbankdrücken","Schrägbankdrücken Multipresse","Schrägbankdrücken Maschine","Brustpresse (Panatta)","Brustpresse (Precor)","Butterfly Maschine","Flys von oben Kabel","Flys von unten Kabel","Flachbank KH Flys","Schrägbank KH Flys"],
"Schultern":["KH Seitheben","Vorgebeugtes KH Seitheben","Seithebemaschine (sitzend)","Seithebemaschine (stehend)","Seitheben Kabel","Vorgebeugtes Seitheben Kabel","LH Überkopfdrücken","KH Überkopfdrücken","Überkopfmaschine","Butterfly Reverse Maschine","Butterfly Reverse Kabel","Upright Row Kabel","Arnold Press","Einarmiges Überkopfdrücken Kabel"],
"Bizeps":["SZ Curls","LH Curls","KH Curls","Kabel Curls","KH Hammer Curls","SZ Preacher Curls","KH Preacher Curls","Bizeps Maschine","Konzentrations Curls","Spinne Curls","Kabel Curls einarmig","Reverse Curls"],
"Trizeps":["SZ Skullcrusher","Enges Bankdrücken","Pushdown Kabel","Pushdown Kabel einarmig","SZ Überkopf Tri. Drücken","KH Überkopf Tri. Drücken","Kabel Überkopf Tri. Drücken","Dips Maschine","Trizeps Maschine","KH Kickback Trizeps"],
"Bauch":["Crunches","Crunches am Kabelzug","Panatta Super Crunch","Panatta Low Crunch","Panatta High Crunch","Bauch Maschine (Precor)","Beinheben (Liegend)","Beinheben (Hängend)","Reverse Crunch","Dead Bug","Ab Rollout","Pallof Press","Hollow Body Hold"]
};
const TIPS={
"Hip Thrusts Langhantel":"Stange auf Hüftbeugern auflegen, Schulterblätter auf Bank. Hüfte vollständig strecken, Gesäß oben kurz anspannen. Kinn zur Brust, Blick nach oben.",
"Hip Thrust Kurzhantel":"KH auf Hüfte halten. Gleicher Bewegungsablauf wie LH-Variante. Für isolierte Anspannung oben kurz halten.",
"Hip Thrusts Multipresse":"Stange in Multipresse auf Hüfte. Fußposition ausprobieren – etwas weiter vorne betont mehr den Po.",
"Hip Thrust Maschine":"⚙ Einstellung: Rückenpolster knapp unter die Schulterblätter, Hüftpolster mittig auf den Hüftknochen festziehen. Füße so stellen, dass die Knie oben im 90-Grad-Winkel stehen – bei 169 cm meist mittlere Fußposition. Fersen bleiben komplett am Boden.\nAusführung: Hüfte vollständig durchstrecken, oben 1 Sek. Po maximal anspannen, Kinn leicht zur Brust. Kein Hohlkreuz – Becken leicht einrollen.",
"Glute Bridge Langhantel":"Wie Hip Thrust, aber flach auf dem Boden liegend. Schulterblätter am Boden. Hüfte vollständig strecken.",
"Glute Bridge Kurzhantel":"KH auf Hüfte. Flach auf dem Boden, Hüfte hochdrücken bis volle Streckung.",
"Glute Bridge Multipresse":"Boden-Variante in der Multipresse. Fußstellung leicht erhöht möglich für mehr Range.",
"Kabel Kickback Stehend":"Gewicht am Fußgelenk. Oberkörper leicht vorgebeugt, Hüfte stabil. Bein nach hinten-oben, Gesäß anspannen – nicht schwingen.",
"Kabel Kickback Flachbank":"Auf Flachbank kniend, Gewicht am Fußgelenk. Bein nach hinten-oben strecken, oben kurz halten.",
"Kabel Kickback Schrägbank":"Oberkörper auf Schrägbank gestützt. Gibt mehr Stabilität für isolierte Ausführung.",
"Kabel Kickback Liegend":"Auf dem Bauch liegend, Kabel am Fußgelenk. Bein vom Boden abheben und nach oben-hinten strecken. Hüfte bleibt am Boden – isolierte Glute-Max-Kontraktion.",
"Kickback Multipresse":"Multipresse ermöglicht geführte Bewegung. Auf alle vier stützen, Bein nach hinten durchstrecken.",
"Kickback Maschine":"⚙ Einstellung: Brust-/Unterarmauflage so einstellen, dass die Hüfte fest am Polster liegt und beim Treten nicht kippt. Fußplatte oder Rolle mittig unter der Fußsohle bzw. an der Ferse.\nAusführung: Ferse nach hinten-oben drücken, oben 1 Sek. halten, langsam zurück. Becken bleibt gerade – nicht mitdrehen, nicht schwingen.",
"Kabel Abduktion Stehend":"Standbein leicht gebeugt. Bein seitlich hochführen, Hüfte nicht mitrotieren. Oberkörper stabil halten.",
"Kabel Abduktion Liegend":"Auf der Seite liegend, Kabel am unteren Fußgelenk. Bein seitlich heben, kurz halten.",
"Kabel Abduktion Schrägbank":"Auf Schrägbank gestützt für stabilen Oberkörper. Bein seitlich führen.",
"Abduktionsmaschine":"⚙ Einstellung: Sitz so, dass Hüfte und Knie im 90-Grad-Winkel stehen und die Polster außen knapp über dem Knie anliegen. Startweite mit leichter Vordehnung wählen.\nAusführung: Knie nach außen drücken, 1 Sek. halten, langsam zurück – exzentrische Phase nutzen. Trick für mehr oberen Po: Oberkörper leicht nach vorne lehnen.",
"Pelvic Drop":"Einbeinig auf einer Stufe stehen. Hüfte der Hängeseite langsam absinken lassen, dann Glute Med anspannen und anheben.",
"Abduktionsmaschine stehend":"⚙ Einstellung: Beckenpolster bzw. Auflage auf Hüfthöhe, Standbein mittig und leicht gebeugt, Polster am Arbeitsbein außen knapp über dem Knie.\nAusführung: Bein seitlich heben ohne mit dem Oberkörper wegzukippen, oben kurz halten. Mehr Glute-Med-Aktivierung als sitzend.",
"Fire Hydrants Kabel":"Auf allen Vieren, Kabel am Knie/Fußgelenk. Bein seitlich-nach-oben führen wie ein Feuerhydrant. Hüfte nicht mitdrehen.",
"Low Bar Squat":"⚠️ Für Po-Fokus: Füße weit auseinander, Zehen leicht nach außen, Fersen ggf. erhöht. Tief absenken, Knie über Zehen. Enger Stand + volle Tiefe = mehr Quad – bei Ziel schmale Beine vermeiden!",
"Beinpresse":"⚙ Einstellung: Rückenlehne eher flach stellen, Sitz so, dass der untere Rücken unten NICHT vom Polster abrollt. Füße HOCH und breit auf der Plattform, Zehen leicht nach außen.\n⚠️ Für Po-Fokus: genau diese hohe, breite Fußstellung – enge tiefe Fußstellung = mehr Quad. Bei Ziel schmale Beine im Zweifel lieber Reverse Lunge oder Split Squat. Durch die Fersen drücken, Knie Richtung Zehen führen.",
"Step Ups":"Hohe Box (mind. Kniehöhe) für maximale Glute-Aktivierung. Ferse fest aufstellen, durch die Ferse drücken.",
"Split Squat Kurzhantel":"✅ Gute Wahl bei Ziel schmale Beine. Hinterer Fuß auf Bank oder am Boden. Oberkörper leicht vorgebeugt – mehr Po, weniger Quad.",
"Split Squat Langhantel":"✅ Gute Wahl bei Ziel schmale Beine. Stange auf Schultern, Oberkörper leicht vorgebeugt – mehr Glute-Aktivierung als aufrecht.",
"Split Squat Multipresse":"✅ Gute Wahl bei Ziel schmale Beine. Geführte Variante, mehr Stabilität. Oberkörper leicht vorgebeugt halten.",
"Hack Squat":"⚙ Einstellung: Schulterpolster so hoch, dass du zum Entriegeln nur leicht aufrichten musst. Rücken und Becken fest an der Lehne.\n⚠️ Für Po-Fokus: Füße weit oben auf der Plattform, weit auseinander, tief absenken. Enger Stand + flache Fußstellung = dominanter Quad – bei Ziel schmale Beine nur mit weitem hohen Stand.",
"Reverse Lunge":"✅ Beste Wahl bei Ziel schmale Beine. Weniger Quad-dominant als alle anderen Varianten. Schritt weit nach hinten, durch Ferse drücken.",
"RDL Langhantel":"Füße hüftbreit, Stange nah am Körper. Hüfte nach hinten schieben, Rücken gerade. Dehnung in den Hamstrings spüren, dann durch Gesäß nach oben.",
"RDL Kurzhanteln":"Gleiche Technik wie LH-RDL. KH vor dem Körper, nah an den Beinen entlangführen.",
"Glute Hyperextensions":"⚙ Einstellung: Polsterkante exakt auf den Hüftknochen – die Hüfte muss frei beugen können, sonst arbeitet der Rücken.\nAusführung: Oberkörper absenken, dann durch das Gesäß strecken – nicht mit dem Rücken aufschwingen. Oberen Rücken leicht rund lassen und Zehen leicht nach außen drehen = mehr Po, weniger unterer Rücken. Oben 1 Sek. Po anspannen.",
"Reverse Hack RDL":"✅ Ideal für Po und den Übergang Gesäß/Beinrückseite – ohne Quad-Belastung.\n⚙ Einstellung: Umdrehen – Gesicht zur Maschine, Schultern unter die Pads. Schulterpolster so hoch, dass du fast gestreckt startest. Füße hüftbreit und etwas WEITER VORNE auf der Plattform als normal – mehr Hüftbeugung = mehr Po.\nAusführung: Wie ein RDL – Hüfte zuerst nach hinten schieben, nicht wie ein Squat einbeugen. Knie bleiben fix, Core fest, natürliche Lendenlordose. Oben durch die Fersen drücken und Po bewusst anspannen.",
"Good Mornings":"Stange auf den Schultern. Hüfte nach hinten schieben, Rücken neutral. Hamstring-Dehnung halten, dann zurück.",
"Single-Leg RDL":"Einbeinig, hinteres Bein gestreckt nach hinten heben. Mehr Glute-Aktivierung als beidbeinig. Hüfte stabil halten – nicht rotieren.",
"Leg Curl (Maschine)":"⚙ Einstellung: Kniegelenk EXAKT auf die Drehachse der Maschine ausrichten (oft markiert) – Sitz entsprechend vor/zurück schieben. Fußrolle ans untere Wadenende knapp über die Ferse, Schenkelpolster fest auf die Oberschenkel. Bei 169 cm: mittlere Sitzposition als Start.\nAusführung: Fersen kontrolliert Richtung Po ziehen, kurz halten, langsam in die volle Streckung zurück – gibt der Beinrückseite die runde Form direkt unterm Po.",
"Nordic Curls":"Knie auf gepolsterter Unterlage, Füße fixiert. Oberkörper langsam nach vorne fallen lassen – exzentrische Hamstring-Arbeit. Fortgeschrittene Übung.",
"LH Rudern":"Oberkörper ca. 45 Grad vorgebeugt. Stange zum Bauch ziehen, Ellbogen nah am Körper.",
"KH Rudern":"Einarmig auf Bank gestützt. KH zum Hüftknochen ziehen, Schulterblatt einziehen.",
"KH Rudern (breit)":"Ellbogen weiter außen – betont oberen Rücken und hintere Schulter.",
"Rudern Kabel (eng)":"Sitzend, enges Griffstück. Zur Bauchgegend ziehen, Schulterblätter zusammenziehen.",
"Rudern Kabel (breit)":"Breites Griffstück. Ellbogen seitlich – mehr Latissimus.",
"Rudermaschine (Panatta)":"⚙ Einstellung: Sitzhöhe so, dass die Griffe auf Höhe der unteren Brust liegen. Brustpolster so weit weg, dass die Arme gestreckt starten und die Schulterblätter nach vorne können (volle Dehnung). Bei 169 cm: mittlere Sitzhöhe als Start.\nAusführung: Brust am Pad lassen, Schulterblätter am Ende zusammenziehen, nicht mit dem Oberkörper schwingen. Langsam zurück.",
"Rudermaschine (Precor)":"⚙ Einstellung: Sitzhöhe so, dass die Griffe auf Höhe der unteren Brust liegen. Brustpolster so, dass die Arme gestreckt starten und die Schulterblätter nach vorne können. Bei 169 cm: mittlere Sitzhöhe als Start.\nAusführung: Brust am Pad lassen, Schulterblätter am Ende zusammenziehen, nicht mit dem Oberkörper schwingen. Langsam zurück.",
"Latzug (eng)":"Enger Parallelgriff. Zur Brust ziehen, Ellbogen nach unten-hinten.",
"Latzug (breit)":"Breiter Overhand-Griff. Zur Brust ziehen, Latissimus aktiv.",
"Latzug Maschine (Panatta)":"⚙ Einstellung: Sitz so, dass die Füße flach stehen, Kniepolster fest auf die Oberschenkel. Griffe mit gestreckten Armen gerade so erreichbar.\nAusführung: Zur Brust ziehen, Ellbogen nach unten-hinten führen, Latissimus aktiv anspannen. Kontrolliert zurück und oben die Schultern lang werden lassen (Stretch).",
"Latzug Maschine (Precor)":"⚙ Einstellung: Sitz so, dass die Füße flach stehen, Kniepolster fest auf die Oberschenkel. Griffe mit gestreckten Armen gerade so erreichbar.\nAusführung: Zur Brust ziehen, Ellbogen nach unten-hinten führen, Latissimus aktiv anspannen. Kontrolliert zurück und oben die Schultern lang werden lassen (Stretch).",
"Überzug am Kabel":"Liegend oder stehend vorgebeugt. Gerade Arme, Lat zieht den Arm nach unten.",
"T Bar Rudern (neutral)":"Neutraler Griff. Brust auf Pad, Stange zum Bauch ziehen.",
"T Bar Rudern (breit)":"Breiter Griff. Mehr oberer Rücken.",
"Assistierter Klimmzug (eng)":"⚙ Einstellung: Bei 56 kg Körpergewicht brauchst du meist wenig Hilfe – starte mit ca. 24–30 kg Unterstützung und reduziere, sobald 8 saubere Wdh. klappen. Knie mittig aufs Polster.\nAusführung: Enger Parallelgriff. Schulterblätter zuerst einziehen, dann Ellbogen nach unten. Körper nicht schwingen.",
"Assistierter Klimmzug (breit)":"⚙ Einstellung: Bei 56 kg Körpergewicht brauchst du meist wenig Hilfe – starte mit ca. 24–30 kg Unterstützung und reduziere, sobald 8 saubere Wdh. klappen. Knie mittig aufs Polster.\nAusführung: Breiter Griff, Lat-Fokus. Schulterblätter zuerst einziehen, dann ziehen. Körper nicht schwingen.",
"Face Pull Kabel":"Kabel auf Kopfhöhe, Seil-Aufsatz. Zur Stirn ziehen, Ellbogen hoch. Betont hintere Schulter und oberen Rücken – gut für Haltung.",
"Straight-Arm Pulldown":"Kabel oben, Arme gestreckt. Lat nach unten ziehen bis Oberschenkel. Isolierter Lat ohne Bizeps.",
"Einarmiger Latzug Kabel":"Einarmig am Kabel. Mehr Range und Rotation möglich. Lat gut einziehen am Ende.",
"Diverging Low Row":"⚙ Einstellung: Sitzhöhe so, dass das Brustpolster auf Brustmitte liegt und die Griffe auf Bauchhöhe starten.\nAusführung: Griffe zur Hüfte ziehen – divergierender Zugweg. Schulterblätter am Ende zusammenziehen, nicht mit dem Oberkörper schwingen.",
"Super Squat":"⚙ Einstellung: Schulterpolster so, dass du beim Einstieg fast gestreckt stehst, Rücken fest an der Lehne.\n⚠️ Für Po-Fokus: Füße weit vorne und breit positionieren, tief absenken, durch die Fersen drücken. Enge tiefe Fußstellung = mehr Quad – bei Ziel schmale Beine weite vordere Stellung wählen.",
"LH Bankdrücken":"Schulterbreiter Griff. Stange zur unteren Brust, Ellbogen ca. 75 Grad vom Körper.",
"KH Bankdrücken":"Ermöglicht mehr Bewegungsfreiheit. KH am Ende leicht zusammenführen.",
"Bankdrücken Multipresse":"Geführte Bewegung. Griffposition anpassen – leicht schräg für natürlichere Bewegung.",
"LH Schrägbankdrücken":"30–45 Grad Neigung. Betont obere Brust. Griffbreite wie flaches Drücken.",
"KH Schrägbankdrücken":"Mehr Range als LH-Variante. KH am Ende zusammenführen.",
"Schrägbankdrücken Multipresse":"Maschinen-Führung. Bank auf 30–45 Grad einstellen.",
"Brustpresse (Panatta)":"⚙ Einstellung: Sitzhöhe so, dass die Griffe auf Brusthöhe liegen und die Ellbogen in Linie mit den Schultern oder leicht darunter sind.\nAusführung: Schulterblätter zusammenziehen, volle Streckung oben ohne die Ellbogen zu sperren, langsam zurück.",
"Brustpresse (Precor)":"⚙ Einstellung: Sitzhöhe so, dass die Griffe auf Brusthöhe liegen und die Ellbogen in Linie mit den Schultern oder leicht darunter sind.\nAusführung: Schulterblätter zusammenziehen, volle Streckung oben ohne die Ellbogen zu sperren, langsam zurück.",
"Bankdrücken Maschine":"⚙ Einstellung: Sitz so, dass die Griffe auf Brusthöhe sind, Schulterblätter zusammengezogen fest am Polster.\nAusführung: Kontrolliert drücken, langsam zurück, Spannung halten.",
"Butterfly Maschine":"⚙ Einstellung: Sitz so, dass Hände und Ellbogen auf Brusthöhe sind. Startweite so wählen, dass du Dehnung ohne Schulterzwicken spürst.\nAusführung: Arme leicht gebeugt, Brust aktiv zusammendrücken, nicht mit Schwung. Langsam öffnen.",
"Flys von oben Kabel":"Kabel oben befestigt. Arme bogenmäßig nach unten-vorne führen – Brust komprimieren.",
"Flys von unten Kabel":"Kabel unten befestigt. Arme bogenmäßig nach oben-vorne führen – betont obere Brust.",
"Flachbank KH Flys":"Arme weit öffnen für maximale Dehnung. Leicht gebeugte Ellbogen, Brust zusammenziehen oben.",
"Schrägbank KH Flys":"30–45 Grad Bank. Mehr Stretch für obere Brust. Gleiche Technik wie Flachbank-Variante.",
"KH Seitheben":"Leichtes Gewicht, sauber ausführen. Arme leicht gebeugt, seitlich bis Schulterhöhe heben. Kleine Finger leicht oben.",
"Vorgebeugtes KH Seitheben":"Oberkörper 45–90 Grad vorgebeugt. Hintere Schulter. Arme seitlich heben.",
"Seithebemaschine (sitzend)":"⚙ Einstellung: Sitz so, dass die Schultern auf einer Linie mit der Drehachse liegen, Polster knapp über dem Ellbogen.\nAusführung: Arme seitlich bis Schulterhöhe heben, oben kurz halten, langsam zurück – nicht mit Schwung.",
"Seithebemaschine (stehend)":"⚙ Einstellung: Polster so, dass sie knapp über dem Ellbogen anliegen, aufrecht und mittig stehen.\nAusführung: Arme seitlich bis Schulterhöhe heben, Oberkörper stabil – nicht wegkippen, kein Schwung.",
"Seitheben Kabel":"Kabel unten befestigt, Arm seitlich heben. Konstante Spannung.",
"Vorgebeugtes Seitheben Kabel":"Kabel oben befestigt, Oberkörper vorgebeugt. Hintere Schulter.",
"LH Überkopfdrücken":"Stange vor oder hinter dem Kopf. Ellbogen leicht nach vorne für Schultergelenk.",
"KH Überkopfdrücken":"Sitzend oder stehend. KH am Ende leicht zusammenführen.",
"Überkopfmaschine":"⚙ Einstellung: Sitz so, dass die Griffe auf Schulterhöhe starten, Rücken fest an der Lehne, Füße flach am Boden.\nAusführung: Nach oben drücken ohne die Ellbogen ganz zu sperren, langsam zurück bis Schulterhöhe – Spannung halten.",
"Butterfly Reverse Maschine":"⚙ Einstellung: Sitz so, dass die Griffe auf Schulterhöhe sind, Brust fest am Polster.\nAusführung: Arme gestreckt oder leicht gebeugt nach hinten-außen führen, Schulterblätter zusammenziehen, langsam zurück. Hintere Schulter.",
"Butterfly Reverse Kabel":"Kabel auf Schulterhöhe, Arme gekreuzt greifen. Arme nach hinten-außen führen – hintere Schulter, konstante Spannung durch das Kabel.",
"Upright Row Kabel":"Kabel unten, schulterbreiter Griff. Stange nah am Körper hochziehen bis Kinnhöhe. Ellbogen führen die Bewegung.",
"Arnold Press":"KH auf Schulterhöhe, Handflächen zu dir. Beim Drücken nach außen rotieren. Kombiniert Front- und Seite-Schulter.",
"Einarmiges Überkopfdrücken Kabel":"Kabel auf Schulterhöhe, einarmig drücken. Mehr Stabilisationsarbeit als Maschine.",
"SZ Curls":"SZ-Stange reduziert Handgelenkbelastung. Ellbogen stabil, nicht mitschwingen.",
"LH Curls":"Supinierter Griff. Ellbogen nah am Körper. Volle Streckung unten.",
"KH Curls":"Abwechselnd oder gleichzeitig. Volle Supination am Endpunkt.",
"Kabel Curls":"Konstante Spannung durch Kabel. Langsam ablassen.",
"KH Hammer Curls":"Neutraler Griff. Brachialis und Brachioradialis. Ellbogen stabil.",
"SZ Preacher Curls":"Auflagekante auf Trizepsseite. Volle Streckung – gut für Dehnung.",
"KH Preacher Curls":"Einarmig, gleiche Technik. Mehr Kontrolle als beidhändig.",
"Bizeps Maschine":"⚙ Einstellung: Sitz so, dass die Achseln fest auf dem Polster aufliegen und die Ellbogen auf der Drehachse der Maschine liegen.\nAusführung: Volle Streckung unten, volle Kontraktion oben, langsam ablassen.",
"Konzentrations Curls":"Sitzend, Ellbogen am Innenknie gestützt. Sehr isoliert – maximale Kontraktion oben.",
"Spinne Curls":"Auf Schrägbank liegend (Brust nach unten). Arme hängen frei – keine Möglichkeit zu schwingen.",
"Kabel Curls einarmig":"Einarmig für symmetrische Entwicklung. Kabel unten, volle Streckung nutzen.",
"Reverse Curls":"Pronierter Griff. Trainiert Brachioradialis und Unterarme. Wichtig für ausgewogene Armkraft.",
"SZ Skullcrusher":"Stange zur Stirn absenken, Ellbogen stabil halten – nicht aufklappen.",
"Enges Bankdrücken":"Schulterbreiter oder enger Griff. Ellbogen nah am Körper. Trizeps-Fokus.",
"Pushdown Kabel":"Ellbogen stabil an den Seiten. Volles Durchstrecken des Arms, kurz halten.",
"Pushdown Kabel einarmig":"Einarmig – mehr Bewegungsfreiheit und Kontrolle pro Seite.",
"SZ Überkopf Tri. Drücken":"SZ-Stange hinter dem Kopf absenken. Ellbogen eng halten. Trizeps-Dehnung oben.",
"KH Überkopf Tri. Drücken":"Einarmig oder beidhändig. KH hinter dem Kopf, Ellbogen stabil.",
"Kabel Überkopf Tri. Drücken":"Kabel hinter dem Kopf. Konstante Spannung in der Dehnung.",
"Dips Maschine":"⚙ Einstellung: Sitz so, dass die Griffe auf Höhe der unteren Brust starten, Hände schulterbreit.\nAusführung: Ellbogen eng am Körper für Trizeps-Fokus, tief absenken, Schultern weg von den Ohren.",
"Trizeps Maschine":"⚙ Einstellung: Sitz so, dass die Ellbogen auf der Drehachse liegen und die Oberarme fest auf den Pads aufliegen.\nAusführung: Arme vollständig durchstrecken, kurz halten, langsam zurück.",
"KH Kickback Trizeps":"Oberkörper waagerecht, Oberarm parallel zum Boden fixiert. KH nach hinten strecken, kurz halten.",
"Crunches":"Nur Schulterblätter vom Boden heben – kein komplettes Aufrichten. Langsam und kontrolliert.",
"Crunches am Kabelzug":"Kniend am Kabel. Oberkörper nach vorne-unten runden. Gewicht skalieren.",
"Panatta Super Crunch":"⚙ Einstellung: Sitzhöhe (Gasdruck-Hebel) so, dass die Drehachse auf Höhe des unteren Brustbeins liegt, Polster fest an Brust/Schultern.\nAusführung: Oberkörper nach vorne einrollen – der Bauch macht die Arbeit, nicht mit der Hüfte ziehen. Langsam zurück, Spannung halten.",
"Panatta Low Crunch":"⚙ Einstellung: Rücken fest ans Polster, Beine sicher in den Auflagen fixieren.\nAusführung: Fokus unterer Bauch – Beine zur Brust einrollen und das Becken mit einrollen, Rücken bleibt am Polster. Langsam zurück.",
"Panatta High Crunch":"⚙ Einstellung: Sitz so, dass du die Griffe oben bequem greifst, ohne die Schultern hochzuziehen.\nAusführung: Fokus oberer Bauch – Oberkörper nach vorne-unten einrollen, langsam und kontrolliert zurück.",
"Bauch Maschine (Precor)":"⚙ Einstellung: Sitzhöhe so, dass die Drehachse auf Höhe des unteren Brustbeins liegt, Widerstand passend wählen.\nAusführung: Oberkörper nach vorne einrollen, nicht mit der Hüfte ziehen. Langsam zurück.",
"Schrägbankdrücken Maschine":"⚙ Einstellung: Rückenlehne auf ca. 30–45 Grad, Sitz so, dass die Griffe auf Höhe der oberen Brust starten.\nAusführung: Schulterblätter zusammenziehen, kontrolliert drücken und langsam zurück.",
"Beinheben (Liegend)":"Beine gestreckt oder leicht gebeugt. Langsam senken ohne Boden zu berühren. Kein Hüfteinsatz – Becken kippen vermeiden.",
"Beinheben (Hängend)":"An der Stange hängen. Hüfte runden am Endpunkt für mehr Bauch-Aktivierung. Nicht schwingen.",
"Reverse Crunch":"Auf dem Rücken liegend. Becken vom Boden heben, Knie zur Brust. Unterer Bauch, kein Hüftbeuger-Einsatz.",
"Dead Bug":"Rücken flach am Boden. Gegenüberliegenden Arm und Bein strecken, Lendenwirbelkurve bleibt am Boden. Sehr sicher für die Wirbelsäule.",
"Ab Rollout":"Mit Rollrad oder Stange. Fortgeschrittene Übung. Rücken gerade halten – nicht durchhängen. Langsam zurückrollen.",
"Pallof Press":"Kabel seitlich, in Bauchhöhe. Arme nach vorne drücken und halten – Anti-Rotation. Schmal und stabil, keine Hüftbewegung.",
"Hollow Body Hold":"Rücken flach, Arme und Beine gestreckt leicht über dem Boden halten. Isometrische Ganzkörperspannung – sehr effektiv für flachen Bauch.",
"3D Abduktor Maschine":"Panatta-Highlight! Trainiert Abduktion + Streckung + Außenrotation gleichzeitig – aktiviert die hinteren Fasern des Gluteus Medius.\n⚙ Einstellung: 3 Rückenlehnen-Positionen = verschiedene Muskelfasern. Aufrechte Lehne (wenig Hüftbeugung) = hintere Glute-Med-Fasern – dein Fokus! Flachere Lehne = mehr vordere Fasern. Starte mittig, arbeite dich zur aufrechten Position. Sitz so, dass die Hüfte auf Höhe der Drehachse liegt.\nAusführung: Bein im Bogen nach außen-hinten-oben führen, oben kurz halten, kontrolliert zurück. Aufrecht sitzen, Becken fest am Polster.",
"Belt Squat RDL":"✅ Belt Squat Maschine als RDL nutzen – schont den Rücken, schwere Gewichte möglich.\n⚙ Einstellung: Gurt über die Hüftknochen, Füße mittig und hüftbreit (nicht weit vorne wie beim Belt Squat).\nAusführung: Hüftgelenk-Scharnier – Hüfte nach hinten schieben, nicht in die Kniebeuge! Stark auf Hamstrings und Po. Kontrolliert absenken für den Stretch, oben Po anspannen.",
"Belt Squat":"Panatta Belt Squat: Gewicht hängt am Hüftgurt – kein Rückenloading.\n⚙ Einstellung: Gurt fest über die Hüftknochen, Karabiner mittig vor dem Körper einhängen. Füße weit VORNE auf den Fußplatten = mehr Hüftbeugung = maximaler Glute-Fokus! Füße mittig = mehr Quad. Griff vorne nur zur Balance nutzen, nicht hochziehen.\nAusführung: Tief absenken, durch die Fersen drücken, oben Po anspannen.",

function mk(c,w,d,e){return c+'__w'+w+'__d'+d+'__e'+e}
function mkt(c,w,d,e){return 'tip__'+c+'__w'+w+'__d'+d+'__e'+e}
function plan(){return P4}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function rcol(v,r){if(v===''||v==null)return'#555';const n=parseInt(v);if(isNaN(n))return'#555';if(n>=r[1])return'#7bc47a';if(n>=r[0])return'#e8b860';return'#d86868'}
// Parst Gewichtsangaben: "25-27" -> 27 (oberer Wert), "25" -> 25, "27,5" -> 27.5
function parseWeight(w){
  if(!w&&w!==0)return 0;
  const s=String(w).trim().replace(/,/g,'.');
  if(s.includes('-')){
    const parts=s.split('-');
    // letzten Teil nehmen (oberer Wert)
    const upper=parseFloat(parts[parts.length-1]);
    return isNaN(upper)?0:upper;
  }
  const n=parseFloat(s);
  return isNaN(n)?0:n;
}
// true wenn echte Spanne ("42-45"), false bei Einzelwert ("45") oder "45-45"
function isWeightRange(w){
  if(!w&&w!==0)return false;
  const parts=String(w).trim().replace(/,/g,'.').split('-').map(p=>parseFloat(p)).filter(n=>!isNaN(n));
  return parts.length>=2&&parts[0]!==parts[parts.length-1];
}
function prog(cr,pr,cw,pw){
  if(!pr||!pr.length)return null;
  // Keine Auswertung wenn aktuelle Woche noch keine Reps eingetragen
  const crFilled=cr&&cr.filter(v=>v!==''&&v!==undefined&&v!==null&&parseInt(v)>0);
  if(!crFilled||!crFilled.length)return null;
  const prFilled=pr&&pr.filter(v=>v!==''&&v!==undefined&&v!==null&&parseInt(v)>0);
  if(!prFilled||!prFilled.length)return null;
  const cu=parseWeight(cw),pu=parseWeight(pw);
  if(pu>0){
    if(cu>pu)return'w';
    // Glatter Einzelwert auf gleichem Top schlaegt eine Spanne: 45 > 42-45
    if(cu===pu&&!isWeightRange(cw)&&isWeightRange(pw))return'w';
  }
  // Reps als GESAMTSUMME vergleichen, nicht Satz-fuer-Satz.
  // So zaehlt 12/15 genauso viel wie 15/12 (gleiche Gesamtleistung),
  // statt faelschlich Weniger zu melden wenn nur ein Satz niedriger war.
  const cSum=crFilled.reduce((a,v)=>a+(parseInt(v)||0),0);
  const pSum=prFilled.reduce((a,v)=>a+(parseInt(v)||0),0);
  if(cSum>pSum)return'r';
  if(cSum<pSum)return'd';
  return's';
}
function pbadge(p){
  if(!p)return'';
  const m={w:['↑ Gewicht','#7bc47a'],r:['↑ Reps','#7aafdf'],s:['= Gleich','#e8b860'],d:['↓ Weniger','#d86868']};
  const[l,c]=m[p]||[];if(!l)return'';
  return'<span class="pbadge" style="background:'+c+'22;border:1px solid '+c+';color:'+c+'">'+l+'</span>'
}

function autoExtraSets(di,ei){
  if(S.week<4)return 0;
  let streak=0;
  for(let w=S.week-1;w>=Math.max(1,S.week-3);w--){
    const k=mk(S.cy,w,di,ei),pk=mk(S.cy,w-1,di,ei);
    const cur=S.data[k]||{},prv=S.data[pk]||{};
    // Streak nur wenn dieselbe Uebung wie in der Vorwoche
    if(!cur.exercise||!prv.exercise||cur.exercise!==prv.exercise)break;
    if(!prv.weight&&!(prv.reps||[]).some(Boolean))break;
    // Aktuelle Woche muss Reps haben
    if(!cur.reps||!cur.reps.some(v=>v!==''&&parseInt(v)>0))break;
    const st=prog(cur.reps||[],prv.reps||[],cur.weight,prv.weight);
    if(st==='s'||st==='d')streak++;else break;
  }
  return streak>=3?1:0;
}


// Sucht den letzten gespeicherten Wert fuer eine bestimmte Uebung (uebungsbasierter Vergleich)
function findLastExData(di,ei,currentExercise){
  if(!currentExercise)return{};
  // Suche rueckwaerts durch alle Wochen des aktuellen Zyklus
  for(let w=S.week-1;w>=1;w--){
    const k=mk(S.cy,w,di,ei);
    const d=S.data[k];
    if(d&&d.exercise===currentExercise&&(d.weight||( d.reps&&d.reps.some(r=>r!=='')))){
      return d;
    }
  }
  return{};
}
// true wenn Uebung gewaehlt UND alle Saetze der aktuellen Woche Reps haben
function exDone(di,ei){
  const ex=plan()[di].e[ei];
  const k=mk(S.cy,S.week,di,ei);
  const rawCur=S.data[k]||{};
  const pk=S.week>1?mk(S.cy,S.week-1,di,ei):null;
  const prevW=pk?(S.data[pk]||{}):{};
  const exName=rawCur.exercise!==undefined?rawCur.exercise:(prevW.exercise||'');
  if(!exName)return false;
  const xs=rawCur.extraSets!==undefined?rawCur.extraSets:(prevW.extraSets||0);
  const ms=Math.min(5,ex.s+xs+autoExtraSets(di,ei));
  const reps=rawCur.reps||[];
  let filled=0;
  for(let i=0;i<ms;i++){const v=reps[i];if(v!==''&&v!=null&&parseInt(v)>0)filled++}
  return filled>=ms;
}

function renderEx(ex,ei,di){
  const k=mk(S.cy,S.week,di,ei),pk=S.week>1?mk(S.cy,S.week-1,di,ei):null;

    ...rawCur,

    const c=rcol(reps[i],ex.r),pr=(prv.reps||[])[i];
    const prevLabel=S.week>1?(pr!=null&&pr!==''?pr:'0'):'';
    rh+='<div class="rep-col"><span class="rep-lbl">S'+(i+1)+'</span><input class="rep-inp" type="text" inputmode="numeric" value="'+esc(reps[i]||'')+'" placeholder="–" style="border:2px solid '+c+'" oninput="updRep('+di+','+ei+','+i+',this.value)" onchange="updRep('+di+','+ei+','+i+',this.value)"/>'+(prevLabel!==''?'<span class="rep-prev" style="'+(pr==null||pr===''?'color:var(--text-ghost)':'')+'">'+prevLabel+'</span>':'')+'</div>';
  }
  if(xs>0)rh+='<button class="add-set-btn" style="border-color:rgba(216,104,104,0.4);color:var(--red)" onclick="removeSet('+di+','+ei+')">−</button>';
  if(ms<5)rh+='<button class="add-set-btn" onclick="addSet('+di+','+ei+')">+</button>';

  const autoLabel=autoTriggered?'<span style="color:var(--gold);font-size:10px;margin-left:6px">⚡ +1 Satz (3 Wo. kein Fortschritt)</span>':'';

  let fil=0;for(let i=0;i<ms;i++){const v=reps[i];if(v!==''&&v!=null&&parseInt(v)>0)fil++}
  const doneAll=!!cur.exercise&&fil>=ms;
  const doneChip='<span class="done-chip'+(doneAll?'':' hidden')+'" id="done-'+di+'-'+ei+'" title="Alle Sätze eingetragen">✓</span>';

  // Meine Einstellung: uebungsbasiert gespeichert (set__ex__Name), gilt fuer alle Wochen/Zyklen
  let setH='';
  if(cur.exercise){
    const sv=S.data['set__ex__'+cur.exercise]||'';
    setH='<div class="setting-row"><span class="set-lbl" title="Deine Maschinen-Einstellung – wird pro Übung gespeichert und jede Woche angezeigt">⚙</span><input class="set-input" type="text" value="'+esc(sv)+'" placeholder="Meine Einstellung (z. B. Sitz 4, Lehne 2)" onchange="updSetting('+di+','+ei+',this.value)"/></div>';
  }

  return '<div class="ex-row" style="border-left:3px solid '+col+'">'
    +'<div class="ex-row-top"><span class="cat-badge" style="background:'+col+'28;color:'+col+'">'+esc(ex.c)+'</span>'
    +'<div class="picker-wrap" id="pw-'+di+'-'+ei+'">'
    +'<button class="pick-btn'+(cur.exercise?' has-val':'')+'" style="border-color:'+(dropOpen?col:'var(--input-border)')+'" onclick="togDrop('+di+','+ei+',event)">'
    +'<span class="pick-btn-txt">'+esc(cur.exercise||'– Übung wählen –')+'</span>'
    +'<span class="pick-btn-arr">'+(dropOpen?'▲':'▼')+'</span></button>'+dh+'</div>'
    +pbadge(p)+doneChip+'</div>'
    +'<div class="ex-meta"><span class="sets-info">'+ms+' Sätze · <span style="color:'+col+'">'+ex.r[0]+'–'+ex.r[1]+' Reps</span>'+autoLabel+'</span>'
    +'<div class="w-wrap"><span class="w-label">Gewicht:</span><input class="w-input" type="text" value="'+esc(cur.weight||'')+'" placeholder="kg" onchange="updW('+di+','+ei+',this.value)"/>'+(prv.weight?'<span style="color:var(--text-faint);font-size:11px" title="Vergleich mit letztem Eintrag dieser Uebung">(VW: '+esc(prv.weight)+')</span>':'')+'</div></div>'
    +setH
    +'<div class="reps-row">'+rh+'</div>'+hint+tipH+'</div>';
}

function renderOv(){
  const pl=plan();let h='<h2 class="ov-title">Fortschritts-Übersicht</h2><p class="ov-sub">Gewichtsentwicklung pro Übung über alle 12 Wochen.</p>';
  pl.forEach((day,di)=>{
    h+='<div class="ov-day"><div class="ov-day-lbl">'+esc(day.l)+'</div>';
    day.e.forEach((ex,ei)=>{
      const ws=Array.from({length:12},(_,i)=>{const d=S.data[mk(S.cy,i+1,di,ei)]||{};return{w:i+1,name:d.exercise,wt:parseWeight(d.weight)||0}});
      const filled=ws.filter(x=>x.wt>0),name=(ws.find(x=>x.name)||{}).name,nums=ws.map(x=>x.wt),mx=Math.max(...nums,1);
      const col=CC[ex.c]||'#aaa',gain=filled.length>=2?filled[filled.length-1].wt-filled[0].wt:null;
      const bars=nums.map((v,i)=>{
        const isCur=(i+1)===S.week;
        const bg=v>0?'linear-gradient(180deg,'+col+','+col+'77)':'var(--bar-empty)';
        return '<div class="ov-bar" title="W'+(i+1)+': '+(v||'–')+' kg" style="height:'+Math.max(2,v>0?(v/mx*36):2)+'px;background:'+bg+(isCur?';box-shadow:0 0 0 1.5px var(--ring)':'')+'"></div>';
      }).join('');
      h+='<div class="ov-ex" style="border-left:3px solid '+col+'"><div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px"><span style="font-weight:700">'+(name||'<span style="color:var(--text-faint)">—</span>')+'</span><div style="display:flex;gap:12px;align-items:center"><span style="color:'+col+';font-size:11px">'+esc(ex.c)+'</span>'+(gain&&gain>0?'<span style="color:var(--green);font-weight:700">+'+gain.toFixed(1)+' kg</span>':'')+'</div></div><div class="ov-bars">'+bars+'</div><div style="display:flex;justify-content:space-between;margin-top:4px"><span style="font-size:10px;color:var(--text-faint)">W1</span><span style="font-size:10px;color:var(--text-faint)">W12</span></div>'+(filled.length?'<div style="font-size:11px;color:var(--text-dim);margin-top:4px">Start: <b style="color:var(--text)">'+filled[0].wt+' kg</b>'+(filled.length>1?' · Aktuell: <b style="color:var(--green)">'+filled[filled.length-1].wt+' kg</b>':'')+'</div>':'')+'</div>';
    });
    h+='</div>';
  });
  document.getElementById('view-overview').innerHTML=h;
}

// ACTIONS
// Sanfter Einblend-Effekt fuer die aktive Ansicht (Tab-/Zyklus-/Wochen-Wechsel)
function flashView(){
  const el=document.getElementById('view-'+S.view);
  if(el){el.classList.remove('fade-in');void el.offsetWidth;el.classList.add('fade-in')}
}
function setView(v){S.view=v;render();flashView()}
function setCycle(c){S.cy=c;render();flashView()}
function changeWeek(d){const old=S.week;S.week=Math.max(1,Math.min(12,S.week+d));render();if(S.week!==old)flashView()}
function toggleDay(di){const wasOpen=S.openDays[di]===true;S.openDays={};if(!wasOpen){S.openDays[di]=true;S.animDay=di}render()}

function togDrop(di,ei,ev){
  ev.stopPropagation();
  if(S.drop&&S.drop.di===di&&S.drop.ei===ei){S.drop=null}else{S.drop={di,ei};S.dropSearch='';S.dropAnim=true}
  renderT();
  S.dropAnim=false;
  if(S.drop){setTimeout(()=>{
    const el=document.getElementById('ds-'+di+'-'+ei);
    if(el)el.focus();
    const dd=document.getElementById('dd-'+di+'-'+ei);
    const pw=document.getElementById('pw-'+di+'-'+ei);
    if(dd&&pw){const r=pw.getBoundingClientRect();if(window.innerHeight-r.bottom<280){dd.style.bottom='calc(100% + 4px)';dd.style.top='auto'}}
  },20)}
}
function onDS(di,ei,v){
  S.dropSearch=v;renderT();
  // Fokus + Cursor wiederherstellen, da renderT() das Eingabefeld neu aufbaut
  const el=document.getElementById('ds-'+di+'-'+ei);
  if(el){el.focus();const n=el.value.length;el.setSelectionRange(n,n)}
}
function selEx(di,ei,v){
  const k=initKey(di,ei);
  S.data[k]={...S.data[k],exercise:v};save();
  S.drop=null;S.dropSearch='';renderT();
}
function initKey(di,ei){
  const k=mk(S.cy,S.week,di,ei);
  if(!S.data[k]){
    const pk=S.week>1?mk(S.cy,S.week-1,di,ei):null;
    const prv=pk?(S.data[pk]||{}):{};
    S.data[k]={exercise:prv.exercise||'',extraSets:prv.extraSets||0};
  }
  return k;
}
function updW(di,ei,v){const k=initKey(di,ei);S.data[k]={...S.data[k],weight:v};save()}
// Maschinen-Einstellung speichern — uebungsbasiert, KEIN renderT (Fokus bleibt erhalten)
function updSetting(di,ei,v){
  const k=mk(S.cy,S.week,di,ei),pk=S.week>1?mk(S.cy,S.week-1,di,ei):null;
  const rawCur=S.data[k]||{},prevW=pk?(S.data[pk]||{}):{};
  const ex=rawCur.exercise!==undefined?rawCur.exercise:(prevW.exercise||'');
  if(!ex)return;
  const key='set__ex__'+ex;
  if(String(v).trim()==='')delete S.data[key];else S.data[key]=v;
  save();
}
function updRep(di,ei,i,v){
  const k=initKey(di,ei);const cur=S.data[k];
  const ms=Math.min(5,(cur.extraSets||0)+(plan()[di].e[ei].s));
  const r=[...(cur.reps||Array(ms).fill(''))];while(r.length<=i)r.push('');r[i]=v;
  S.data[k]={...cur,reps:r};save();
  refreshDone(di,ei);
}
function addSet(di,ei){const k=initKey(di,ei);S.data[k]={...S.data[k],extraSets:(S.data[k].extraSets||0)+1};save();renderT()}
function removeSet(di,ei){const k=initKey(di,ei);S.data[k]={...S.data[k],extraSets:Math.max(0,(S.data[k].extraSets||0)-1)};save();renderT()}
function togTip(tk){S.tips[tk]=!S.tips[tk];if(!S.tips[tk])S.tipEdit[tk]=false;renderT()}
function edTip(tk){S.tipEdit[tk]=true;renderT()}
function canTip(tk){S.tipEdit[tk]=false;renderT()}
function savTip(tk,tid,sk){const el=document.getElementById(tid);if(el){if(el.value.trim()==='')delete S.data[tk];else S.data[tk]=el.value;save()}S.tipEdit[sk]=false;renderT()}
function resTip(tk,sk){delete S.data[tk];save();S.tipEdit[sk]=false;renderT()}

document.addEventListener('click',e=>{
  if(S.drop&&!e.target.closest('.picker-wrap')){S.drop=null;renderT()}
});

applyTheme();
render();
</script>
</body>
</html>
