<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Peach Project – Trainings-App</title>
<meta name="theme-color" content="#B49DF2"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%91%3C/text%3E%3C/svg%3E"/>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"/>
<link rel="manifest" href="manifest.json"/>
<meta name="apple-mobile-web-app-title" content="Peach Project"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
/* ================= NEOBRUTALISM · LIGHT ONLY ================= */
:root{
  color-scheme:light;
  /* Ink: borders, hard shadows, text on bright blocks */
  --ink:#181016;--on-accent:#181016;
  /* Bright accent palette */
  --peach:#F4A45E;--pink:#F18FB6;--lilac:#B49DF2;--lime:#B6DD57;--sky:#8CCBE8;--yellow:#F5CB44;--cream:#FBF3E7;
  /* Status accents */
  --gold:#F5B53C;--green:#6FC36A;--blue:#5EA8E0;--red:#EC6A6A;
  /* Page */
  --bg:#E9DEF8;--drop-bg:#FBF3E7;--scroll:#B49DF2;--deload-bg:#F5CB44;
  /* Text ramp */
  --text:#181016;--text-soft:#45343D;--text-mid:#5E4C55;--text-dim:#7E6C76;--text-faint:#A2929C;--text-ghost:#C7B8C0;
  /* Surfaces & fields */
  --surface:#FBF3E7;--chip-bg:#FBF3E7;--field-bg:#FFFFFF;--input-bg:#FFFFFF;--input-border:#181016;
  --border:#181016;--border-soft:#181016;--bar-empty:rgba(24,16,22,0.10);--ring:#181016;--focus:#F4A45E;
  /* Category colours (muscle groups) */
  --cat-glute-max:#EE8FB4;--cat-glute-med:#B49DF2;--cat-glute-quad:#E8B86A;--cat-glute-hams:#A7D98C;
  --cat-ruecken:#84C3E0;--cat-brust:#F0A0A0;--cat-schultern:#C2DB7E;--cat-bizeps:#E6C57E;--cat-trizeps:#93B6E0;--cat-bauch:#D6D080;
  /* Progress status */
  --prog-up:#6FC36A;--prog-reps:#5EA8E0;--prog-same:#F5CB44;--prog-down:#EC6A6A;
  /* Fonts */
  --font-display:'Archivo Black','Space Grotesk',system-ui,sans-serif;
  --font-sans:'Space Grotesk',system-ui,-apple-system,sans-serif;
  /* Radii */
  --r-sm:10px;--r-md:12px;--r-lg:16px;--r-xl:20px;--r-pill:999px;
  /* Border width */
  --bw:2.5px;
  /* Hard shadows (solid ink, no blur) */
  --sh-xs:2px 2px 0 var(--ink);--sh-sm:3px 3px 0 var(--ink);--sh-card:4px 4px 0 var(--ink);
  --sh-header:0 3px 0 var(--ink);--sh-drop:5px 5px 0 var(--ink);--sh-press:1px 1px 0 var(--ink);
  /* Motion */
  --ease:cubic-bezier(.2,.8,.2,1);--dur-fast:0.08s;--dur-base:0.12s;--dur-anim:0.22s;--dur-drop:0.14s;--dur-bar:0.45s;
}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);min-height:100vh;-webkit-tap-highlight-color:transparent;}
::-webkit-scrollbar{width:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--scroll);border:2px solid var(--ink);border-radius:999px;}
input,textarea,button{font-family:inherit;}
/* The neobrutalism press: nudge toward the shadow, collapse it. */
button{cursor:pointer;transition:transform var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease),background var(--dur-base),color var(--dur-base),border-color var(--dur-base);}
button:active{transform:translate(2px,2px);}
button.nb-shadow:active{box-shadow:var(--sh-press)!important;}
/* Disabled buttons: flat & cream — no shadow, no press */
button:disabled{background:var(--cream)!important;color:var(--text-dim)!important;border-color:var(--text-dim)!important;box-shadow:none!important;cursor:not-allowed;}
button:disabled:active{transform:none;}
/* Keyboard focus — hard peach ring on every focusable element (a11y).
   !important so it also wins over outline:none in component styles. */
:focus-visible{outline:3px solid var(--focus)!important;outline-offset:2px;}
@keyframes fadeSlide{from{transform:translateY(8px)}to{transform:translateY(0)}}
@keyframes dropIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeSlide var(--dur-anim) var(--ease);}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ===== Header (solid lilac block) ===== */
#header{background:var(--lilac);padding:13px 16px 11px;border-bottom:var(--bw) solid var(--ink);position:sticky;top:0;z-index:50;box-shadow:var(--sh-header);--text:#181016;--text-dim:#5E4C55;--surface:#FBF3E7;--field-bg:#FFF;--on-accent:#181016;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;}
.header-right{display:flex;gap:6px;align-items:center;}
.logo{display:flex;align-items:center;gap:9px;}
.logo-badge{width:40px;height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--cream);border:var(--bw) solid var(--ink);border-radius:50%;}
.logo-emoji{width:24px;height:24px;image-rendering:pixelated;}
.logo-title{font-family:var(--font-display);font-weight:400;font-size:18px;letter-spacing:-0.5px;text-transform:uppercase;color:var(--ink);line-height:1.05;}
.logo-sub{display:inline-block;background:var(--peach);color:var(--ink);font-size:11px;font-weight:600;border:2px solid var(--ink);border-radius:999px;padding:1px 8px;margin-top:4px;}
@media(max-width:430px){.logo-sub{display:none}.logo-title{font-size:16px}.tab-btn{padding:8px 12px}}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.tab-btn{padding:8px 15px;border-radius:999px;border:var(--bw) solid var(--ink);font-size:13px;font-weight:700;}
.tab-btn.active{background:var(--peach);color:var(--ink);box-shadow:var(--sh-sm);}
.tab-btn.inactive{background:var(--surface);color:var(--text);}
.cycle-btn{padding:7px 13px;border-radius:999px;font-size:12px;font-weight:600;border:var(--bw) solid var(--ink);background:transparent;color:var(--ink);}
.cycle-btn.active{background:var(--ink);color:var(--cream);box-shadow:var(--sh-xs);}
.plan-btn{padding:7px 13px;border-radius:999px;font-size:12px;font-weight:700;border:var(--bw) solid var(--ink);background:var(--surface);color:var(--ink);}
.plan-btn.active{background:var(--peach);color:var(--ink);box-shadow:var(--sh-xs);}
.week-nav{margin-left:auto;display:flex;align-items:center;gap:6px;}
.week-arrow{width:38px;height:38px;border-radius:50%;background:var(--sky);border:var(--bw) solid var(--ink);color:var(--ink);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-xs);}
.week-label{font-size:13px;font-weight:700;min-width:64px;text-align:center;background:var(--surface);color:var(--text);border:var(--bw) solid var(--ink);border-radius:999px;padding:6px 10px;}

#content{padding:16px 16px 40px;max-width:680px;margin:0 auto;}

/* ===== Fortschritt block ===== */
.week-progress{background:var(--surface);border:var(--bw) solid var(--ink);border-radius:var(--r-lg);padding:12px 16px;margin-bottom:16px;box-shadow:var(--sh-sm);}
.wp-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px;}
.wp-title{font-family:var(--font-display);text-transform:uppercase;font-size:13px;letter-spacing:-0.5px;color:var(--text);}
.wp-pct{font-family:var(--font-display);font-size:26px;letter-spacing:-1px;color:var(--text);line-height:1;}
.wp-bar-wrap{height:16px;border:2px solid var(--ink);border-radius:999px;background:var(--bar-empty);overflow:hidden;}
.wp-bar{height:100%;border-radius:999px;transition:width var(--dur-bar);}
.wp-sub{margin-top:9px;font-size:12px;color:var(--text-mid);}

/* ===== Day cards (bright colour blocks) ===== */
.day-card{border:var(--bw) solid var(--ink);border-radius:var(--r-xl);margin-bottom:12px;overflow:visible;box-shadow:var(--sh-card);}
.day-header{width:100%;background:none;border:none;padding:15px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--ink);text-align:left;border-radius:var(--r-xl);}
.day-title{font-family:var(--font-display);text-transform:uppercase;font-size:14px;letter-spacing:-0.5px;color:var(--ink);}
.day-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.day-count{font-family:var(--font-display);font-size:11px;padding:5px 11px;border-radius:999px;background:var(--ink);border:2px solid var(--ink);white-space:nowrap;letter-spacing:-0.3px;}
.day-chevron{color:var(--ink);font-size:14px;font-weight:700;}
.day-body{padding:0 12px 12px;}
.day-body.anim{animation:fadeSlide var(--dur-anim) var(--ease);}

/* ===== Exercise rows (cream blocks) ===== */
.ex-row{background:var(--cream);border:var(--bw) solid var(--ink);border-radius:var(--r-lg);padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh-xs);}
.ex-row-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.cat-badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;border:2px solid var(--ink);color:var(--ink);white-space:nowrap;letter-spacing:0.4px;text-transform:uppercase;}
.done-chip{width:22px;height:22px;border-radius:50%;background:var(--green);border:2px solid var(--ink);color:var(--ink);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.picker-wrap{flex:1;min-width:140px;position:relative;}
.pick-btn{width:100%;min-height:40px;background:var(--field-bg);border:var(--bw) solid var(--ink);border-radius:var(--r-sm);color:var(--text-dim);font-size:14px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:6px;text-align:left;}
.pick-btn.has-val{color:var(--text);}
.pick-btn-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.pick-btn-arr{color:var(--text-dim);font-size:10px;flex-shrink:0;}
.dropdown{position:absolute;left:0;right:0;z-index:200;background:var(--drop-bg);border:var(--bw) solid var(--ink);border-radius:var(--r-md);box-shadow:var(--sh-drop);overflow:hidden;}
.dropdown.anim{animation:dropIn var(--dur-drop) var(--ease);}
.drop-search{padding:8px 8px 4px;}
.drop-search input{width:100%;background:var(--field-bg);border:2px solid var(--ink);border-radius:var(--r-sm);color:var(--text);font-size:16px;padding:8px 10px;outline:none;}
.drop-list{max-height:240px;overflow-y:auto;}
.drop-opt{padding:11px 12px;font-size:14px;color:var(--text);cursor:pointer;border-bottom:1.5px solid var(--ink);}
.drop-opt:last-child{border-bottom:none;}
.drop-opt:hover,.drop-opt.hl{background:var(--peach);color:var(--ink);}
.drop-opt.sel{font-weight:700;background:var(--peach);color:var(--ink);}
.drop-empty-opt{color:var(--text-dim);}
.drop-no-results{padding:10px 12px;color:var(--text-faint);font-size:12px;}
.pbadge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;border:2px solid var(--ink);color:var(--ink);white-space:nowrap;}
.ex-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.sets-info{color:var(--text-mid);font-size:12px;}
.w-wrap{display:flex;align-items:center;gap:6px;}
.w-label{color:var(--text);font-size:12px;background:var(--surface);border:2px solid var(--ink);border-radius:999px;padding:2px 8px;}
.w-input{width:78px;background:var(--field-bg);border:var(--bw) solid var(--ink);border-radius:var(--r-sm);color:var(--text);font-size:16px;font-weight:700;padding:7px 8px;outline:none;}
.w-input:focus,.rep-inp:focus,.drop-search input:focus,.tip-ta:focus,.set-input:focus,.bk-ta:focus{box-shadow:var(--sh-xs)!important;}
.setting-row{display:flex;align-items:center;gap:7px;margin-bottom:8px;}
.set-lbl{flex-shrink:0;cursor:default;width:26px;height:26px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink);}
.set-input{flex:1;min-width:0;background:var(--field-bg);border:var(--bw) solid var(--ink);border-radius:var(--r-sm);color:var(--text);font-size:16px;padding:7px 9px;outline:none;}
.reps-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.rep-col{display:flex;flex-direction:column;align-items:center;gap:2px;}
.rep-lbl{color:var(--text);font-size:10px;font-weight:600;}
.rep-inp{width:46px;text-align:center;background:var(--field-bg);border:var(--bw) solid var(--ink);border-radius:var(--r-sm);color:var(--text);font-size:16px;font-weight:700;padding:8px 2px;outline:none;}
.rep-prev{color:var(--text-faint);font-size:10px;}
.add-set-btn{width:38px;height:38px;border-radius:50%;background:var(--lime);border:var(--bw) solid var(--ink);color:var(--ink);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-xs);}
.phint{margin-top:8px;font-size:11px;color:var(--text-dim);}

/* ===== Tips ===== */
.tip-toggle{background:var(--cream);border:2px solid var(--ink);border-radius:999px;color:var(--ink);font-size:12px;font-weight:700;padding:6px 12px;display:inline-flex;align-items:center;gap:5px;margin-top:8px;}
.tip-toggle.open{background:var(--yellow);box-shadow:var(--sh-xs);}
.tip-i{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink);font-size:9px;font-weight:700;}
.tip-custom{color:var(--text-soft);font-size:10px;font-weight:600;}
.tip-panel{margin-top:6px;background:#FFFDF7;border:var(--bw) solid var(--ink);border-radius:var(--r-md);padding:10px 12px;animation:fadeSlide var(--dur-anim) var(--ease);}
.tip-text{color:var(--text);font-size:12px;line-height:1.65;white-space:pre-wrap;}
.tip-note{margin-top:9px;padding-top:9px;border-top:1.5px dashed var(--ink);}
.tip-note-lbl{color:var(--text-soft);font-size:11px;font-weight:700;margin-bottom:4px;}
.tip-ta{width:100%;margin-top:4px;background:var(--field-bg);border:var(--bw) solid var(--ink);border-radius:var(--r-sm);color:var(--text);font-size:16px;line-height:1.6;padding:8px 10px;resize:vertical;outline:none;}
.tip-edit-btn{margin-top:8px;background:var(--cream);border:2px solid var(--ink);border-radius:999px;color:var(--ink);font-size:12px;font-weight:600;padding:6px 12px;}
.tip-acts{display:flex;gap:8px;margin-top:7px;align-items:center;}
.tip-save{background:var(--peach);border:2px solid var(--ink);border-radius:999px;color:var(--ink);font-size:12px;font-weight:700;padding:8px 16px;box-shadow:var(--sh-xs);}
.tip-cancel{background:var(--surface);border:2px solid var(--ink);border-radius:999px;color:var(--ink);font-size:12px;font-weight:600;padding:8px 13px;}
.tip-reset{background:none;border:none;color:var(--text-dim);font-size:12px;padding:8px;margin-left:auto;text-decoration:underline;}

/* ===== Übersicht ===== */
.ov-title{font-family:var(--font-display);text-transform:uppercase;font-size:34px;letter-spacing:-1px;line-height:1.05;margin-bottom:6px;color:var(--text);}
.bk-card{background:var(--sky);border:var(--bw) solid var(--ink);border-radius:var(--r-xl);padding:16px;margin-top:24px;box-shadow:var(--sh-card);}
.bk-title{font-family:var(--font-display);text-transform:uppercase;font-size:15px;letter-spacing:-0.5px;margin-bottom:6px;color:var(--ink);}
.bk-sub{color:var(--ink);font-size:12px;line-height:1.6;margin-bottom:12px;}
.bk-btn{background:var(--peach);border:var(--bw) solid var(--ink);border-radius:999px;color:var(--ink);font-size:13px;font-weight:700;padding:10px 16px;box-shadow:var(--sh-sm);}
.bk-btn.bk-imp{background:var(--cream);margin-top:10px;}
.bk-status{display:block;margin-top:10px;font-size:12px;font-weight:600;color:var(--ink);min-height:16px;}
.bk-ta{width:100%;margin-top:12px;background:var(--field-bg);border:var(--bw) solid var(--ink);border-radius:var(--r-sm);color:var(--text);font-size:16px;padding:8px 10px;outline:none;resize:vertical;}
.ov-sub{color:var(--text);font-size:13px;margin-bottom:20px;line-height:1.6;}
.ov-day{margin-bottom:24px;}
.ov-day-lbl{display:inline-block;font-family:var(--font-display);text-transform:uppercase;font-size:13px;letter-spacing:-0.5px;color:var(--ink);border:var(--bw) solid var(--ink);border-radius:999px;padding:5px 12px;margin-bottom:12px;}
.ov-ex{background:var(--cream);border:var(--bw) solid var(--ink);border-radius:var(--r-xl);padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh-card);}
.ov-bars{display:flex;align-items:flex-end;gap:4px;height:48px;}
.ov-bar{flex:1;height:100%;border:2px solid var(--ink);border-radius:999px;background:var(--bar-empty);overflow:hidden;display:flex;align-items:flex-end;}
.ov-bar-fill{width:100%;border-radius:999px;transition:height .3s;}
.hidden{display:none!important;}
</style>
</head>
<body>
<div style="max-width:680px;margin:0 auto;">
<div id="header">
  <div class="header-top">
    <div class="logo">
      <span class="logo-badge">
      <svg class="logo-emoji" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
        <!-- Blatt -->
        <rect x="7" y="0" width="1" height="1" fill="#4a9e3f"/>
        <rect x="8" y="0" width="2" height="1" fill="#5cb85c"/>
        <rect x="8" y="1" width="1" height="1" fill="#4a9e3f"/>
        <rect x="9" y="1" width="1" height="1" fill="#5cb85c"/>
        <!-- Stiel -->
        <rect x="7" y="1" width="1" height="2" fill="#7a5230"/>
        <!-- Pfirsich Körper -->
        <rect x="4" y="3" width="8" height="1" fill="#f4a460"/>
        <rect x="3" y="4" width="10" height="1" fill="#f4a460"/>
        <rect x="2" y="5" width="12" height="1" fill="#ffb347"/>
        <rect x="2" y="6" width="12" height="1" fill="#ffb347"/>
        <rect x="2" y="7" width="6" height="1" fill="#ffb347"/>
        <rect x="8" y="7" width="6" height="1" fill="#ff8c69"/>
        <rect x="2" y="8" width="5" height="1" fill="#ffb347"/>
        <rect x="7" y="8" width="7" height="1" fill="#ff8c69"/>
        <rect x="2" y="9" width="4" height="1" fill="#ffb347"/>
        <rect x="6" y="9" width="8" height="1" fill="#ff8c69"/>
        <rect x="3" y="10" width="3" height="1" fill="#ffb347"/>
        <rect x="6" y="10" width="7" height="1" fill="#ff8c69"/>
        <rect x="4" y="11" width="2" height="1" fill="#ffb347"/>
        <rect x="6" y="11" width="6" height="1" fill="#ff8c69"/>
        <rect x="4" y="12" width="8" height="1" fill="#ff8c69"/>
        <rect x="5" y="13" width="6" height="1" fill="#e8735a"/>
        <!-- Kerbe oben -->
        <rect x="7" y="3" width="2" height="1" fill="#e8735a"/>
        <rect x="7" y="4" width="2" height="1" fill="#f4a460"/>
        <!-- Highlight -->
        <rect x="4" y="5" width="2" height="2" fill="#ffd59e"/>
        <rect x="5" y="5" width="1" height="1" fill="#ffe8c8"/>
      </svg>
      </span>
      <div><div class="logo-title">Peach Project</div><div class="logo-sub">Trainings-App</div></div>
    </div>
    <div class="header-right">
      <button class="tab-btn nb-shadow active" id="btn-training" onclick="setView('training')">Training</button>
      <button class="tab-btn nb-shadow inactive" id="btn-overview" onclick="setView('overview')">Übersicht</button>
    </div>
  </div>
  <div class="controls">
    <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center;">
      <button class="plan-btn nb-shadow" id="plan-p3" onclick="setPlan('p3')">3 Tage</button>
      <button class="plan-btn nb-shadow active" id="plan-p4" onclick="setPlan('p4')">4 Tage</button>
    </div>
    <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center;">
      <button class="cycle-btn nb-shadow active" id="cycle-cycle1" onclick="setCycle('cycle1')">Zyklus 1</button>
      <button class="cycle-btn nb-shadow" id="cycle-cycle2" onclick="setCycle('cycle2')">Zyklus 2</button>
      <button class="cycle-btn nb-shadow" id="cycle-cycle3" onclick="setCycle('cycle3')">Zyklus 3</button>
    </div>
    <div class="week-nav">
      <button class="week-arrow nb-shadow" onclick="changeWeek(-1)">&#8249;</button>
      <span class="week-label" id="week-label">W 1 / 12</span>
      <button class="week-arrow nb-shadow" onclick="changeWeek(1)">&#8250;</button>
    </div>
  </div>

"Panatta Super Crunch":"⚙ Einstellung: Sitzhöhe (Gasdruck-Hebel) so, dass die Drehachse auf Höhe des unteren Brustbeins liegt, Polster fest an Brust/Schultern.\nAusführung: Oberkörper nach vorne einrollen – der Bauch macht die Arbeit, nicht mit der Hüfte ziehen. Langsam zurück, Spannung halten.",
"Panatta Low Crunch":"⚙ Einstellung: Rücken fest ans Polster, Beine sicher in den Auflagen fixieren.\nAusführung: Fokus unterer Bauch – Beine zur Brust einrollen und das Becken mit einrollen, Rücken bleibt am Polster. Langsam zurück.",
"Panatta High Crunch":"⚙ Einstellung: Sitz so, dass du die Griffe oben bequem greifst, ohne die Schultern hochzuziehen.\nAusführung: Fokus oberer Bauch – Oberkörper nach vorne-unten einrollen, langsam und kontrolliert zurück.",
"Bauch Maschine (Precor)":"⚙ Einstellung: Sitzhöhe so, dass die Drehachse auf Höhe des unteren Brustbeins liegt, Widerstand passend wählen.\nAusführung: Oberkörper nach vorne einrollen, nicht mit der Hüfte ziehen. Langsam zurück.",
"Schrägbankdrücken Maschine":"⚙ Einstellung: Rückenlehne auf ca. 30–45 Grad, Sitz so, dass die Griffe auf Höhe der oberen Brust starten.\nAusführung: Schulterblätter zusammenziehen, kontrolliert drücken und langsam zurück.",
"Beinheben (Liegend)":"Beine gestreckt oder leicht gebeugt. Langsam senken ohne Boden zu berühren. Kein Hüfteinsatz – Becken kippen vermeiden.",
"Beinheben (Hängend)":"An der Stange hängen. Hüfte runden am Endpunkt für mehr Bauch-Aktivierung. Nicht schwingen.",
"Reverse Crunch":"Auf dem Rücken liegend. Becken vom Boden heben, Knie zur Brust. Unterer Bauch, kein Hüftbeuger-Einsatz.",
"Dead Bug":"Rücken flach am Boden. Gegenüberliegenden Arm und Bein strecken, Lendenwirbelkurve bleibt am Boden. Sehr sicher für die Wirbelsäule.",

"Pallof Press":"Kabel seitlich, in Bauchhöhe. Arme nach vorne drücken und halten – Anti-Rotation. Schmal und stabil, keine Hüftbewegung.",
"Hollow Body Hold":"Rücken flach, Arme und Beine gestreckt leicht über dem Boden halten. Isometrische Ganzkörperspannung – sehr effektiv für flachen Bauch.",
"3D Abduktor Maschine":"Panatta-Highlight! Trainiert Abduktion + Streckung + Außenrotation gleichzeitig – aktiviert die hinteren Fasern des Gluteus Medius.\n⚙ Einstellung: 3 Rückenlehnen-Positionen = verschiedene Muskelfasern. Aufrechte Lehne (wenig Hüftbeugung) = hintere Glute-Med-Fasern – dein Fokus! Flachere Lehne = mehr vordere Fasern. Starte mittig, arbeite dich zur aufrechten Position. Sitz so, dass die Hüfte auf Höhe der Drehachse liegt.\nAusführung: Bein im Bogen nach außen-hinten-oben führen, oben kurz halten, kontrolliert zurück. Aufrecht sitzen, Becken fest am Polster.",
"Belt Squat RDL":"✅ Belt Squat Maschine als RDL nutzen – schont den Rücken, schwere Gewichte möglich.\n⚙ Einstellung: Gurt über die Hüftknochen, Füße mittig und hüftbreit (nicht weit vorne wie beim Belt Squat).\nAusführung: Hüftgelenk-Scharnier – Hüfte nach hinten schieben, nicht in die Kniebeuge! Stark auf Hamstrings und Po. Kontrolliert absenken für den Stretch, oben Po anspannen.",
"Belt Squat":"Panatta Belt Squat: Gewicht hängt am Hüftgurt – kein Rückenloading.\n⚙ Einstellung: Gurt fest über die Hüftknochen, Karabiner mittig vor dem Körper einhängen. Füße weit VORNE auf den Fußplatten = mehr Hüftbeugung = maximaler Glute-Fokus! Füße mittig = mehr Quad. Griff vorne nur zur Balance nutzen, nicht hochziehen.\nAusführung: Tief absenken, durch die Fersen drücken, oben Po anspannen.",
"Beinpresse 45 Grad":"⚙ Einstellung: Rückenlehne in die flachste angenehme Position, Sitz so, dass das Becken unten nicht abkippt.\n⚠️ Fußposition entscheidet, was wächst: Füße HOCH auf der Platte = Glutes und Hamstrings. Füße tief = Quads dominant – bei Ziel schmale Beine unbedingt vermeiden. Für dein Ziel: Füße immer hoch, schulterbreit bis breit, Zehen leicht nach außen. Knie aktiv Richtung Zehen drücken, Rücken bleibt durchgehend am Polster.",
"Adduktionsmaschine":"\u2699 Einstellung: Sitz so, dass Hüfte und Knie im 90-Grad-Winkel stehen, die Polster liegen innen knapp über dem Knie. Startweite so weit öffnen, dass du innen eine deutliche Dehnung spürst – genau da entsteht der Reiz.\nAusführung: Beine kontrolliert zusammenführen, 1 Sek. halten, dann LANGSAM (ca. 3 Sek.) in die volle Dehnung zurück. Rücken bleibt am Polster. Der Adduktor magnus ist gleichzeitig ein Hüftstrecker – er arbeitet mit dem Po und füllt die Innenseite, ohne die Oberschenkel-Vorderseite dicker zu machen.",
"Adduktion Kabel Stehend":"Kabel unten, Manschette ans INNERE Fußgelenk, seitlich zur Maschine stellen und festhalten. Standbein leicht gebeugt.\nAusführung: Arbeitsbein vor dem Standbein vorbei zur Mitte und leicht darüber hinaus ziehen, kurz halten, dann langsam gegen den Zug zurück in die Dehnung. Becken bleibt gerade – nicht mit dem Oberkörper wegkippen.",
"Adduktion Kabel Liegend":"Auf der Seite liegend, Kabel am UNTEREN Fußgelenk, oberes Bein angewinkelt vor dem Körper abgelegt.\nAusführung: Unteres Bein gestreckt nach oben zur Mitte führen, oben kurz halten, langsam ablassen. Sehr isoliert – gute zweite Übung nach der Maschine, wenn die Innenseite schon vorermüdet ist.",
"Copenhagen Plank":"Seitstütz auf dem Unterarm, oberes Bein auf einer Bank abgelegt, unteres Bein frei in der Luft.\nAusführung: Hüfte hochdrücken und Position halten – das obere Bein zieht dich aktiv nach oben. Start: KNIE auf der Bank, 15–20 Sek. pro Seite. Steigerung: gestrecktes Bein auf der Bank. Ins Wdh.-Feld einfach die gehaltenen SEKUNDEN eintragen. Kräftigt Adduktoren und stabilisiert das Becken – ideale Ergänzung zur vielen Abduktions-Arbeit.",
"Sumo Squat Kurzhantel":"✅ Adduktoren + Po ohne Quad-Betonung – passt zum Ziel schmale Beine. Füße deutlich weiter als schulterbreit, Zehen 30–45 Grad nach außen, KH senkrecht zwischen den Beinen.\nAusführung: Hüfte gerade nach UNTEN senken (nicht nach hinten wie beim RDL), Knie aktiv nach außen Richtung Zehen drücken, unten die Innenseite dehnen spüren. Oben Hüfte durchstrecken und Po anspannen, Oberkörper bleibt aufrecht.",
"Sumo RDL Langhantel":"Weiter Sumo-Stand, Zehen nach außen, Stange nah am Körper.\nAusführung: Hüftgelenk-Scharnier – Hüfte nach hinten schieben, Rücken neutral, absenken bis Innenseite und Beinrückseite deutlich ziehen. Der weite Stand verlagert die Arbeit stark auf den Adduktor magnus (ein Hüftstrecker) – sehr po-freundlich und nicht quad-lastig. Oben durch die Fersen drücken.",
"Cossack Squat":"Sehr weiter Stand. Gewicht auf ein Bein verlagern und darauf tief absinken, das andere Bein bleibt gestreckt, Zehen hochgezogen.\nAusführung: Langsam absenken bis zur Dehnung der Innenseite, kurz halten, kontrolliert wieder hoch. Erst mit Körpergewicht sauber lernen, dann leichte KH oder Kettlebell vor der Brust. Bringt Adduktoren-Kraft in voller Dehnung plus Hüftbeweglichkeit.",
"Lateral Lunge":"Seitlicher Ausfallschritt: großer Schritt zur Seite, Gewicht auf das Schrittbein, das andere Bein bleibt gestreckt.\nAusführung: Hüfte nach hinten-unten schieben, der Fuß des gestreckten Beins bleibt flach am Boden – die Innenseite zieht deutlich. Über die Ferse zurückdrücken. Freie Variante des Cossack Squat, gut mit KH oder Kettlebell vor der Brust.",
"RDL Maschine":"⚙ Einstellung: Starthöhe der Griffe etwa auf Mitte Schienbein – volle Hamstring-Dehnung ohne runden Rücken muss möglich sein.\nAusführung: Hüftgelenk-Scharnier – Rücken neutral, Hüfte nach hinten schieben, langsam absenken bis zur starken Dehnung in den Hamstrings – das ist der entscheidende Reiz für Po und Beinrückseite. Oben durch die Fersen drücken und Po aktiv anspannen. Die Maschinenführung macht schwere Gewichte sicher – nutze das für Stretch-Hypertrophie."

// Verschiebt darum alle betroffenen Keys einmalig um +1. Guard: peach_mig_add.

function migAdduktoren(){
  try{
    if(localStorage.getItem('peach_mig_add')==='1')return;
    try{localStorage.setItem('peach_v4_pre_add',JSON.stringify(S.data))}catch{}
    let moved=0;
    for(const m of MIG_ADD)for(let c=1;c<=3;c++){
      const cy=m.p+'cycle'+c;
      for(let w=1;w<=12;w++){
        // ABSTEIGEND laufen, sonst ueberschreibt der verschobene Slot den naechsten
        for(let e=20;e>=m.from;e--){
          const ok=mk(cy,w,m.d,e);
          if(S.data[ok]===undefined)continue;
          S.data[mk(cy,w,m.d,e+1)]=S.data[ok];
          delete S.data[ok];
          moved++;
        }
      }
    }
    if(moved)save();
    localStorage.setItem('peach_mig_add','1');
  }catch{}
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
// Performance-Farbe fuer ausgefuelltes Rep-Feld (leer -> '' = weisses Feld)
function rcol(v,r){if(v===''||v==null)return'';const n=parseInt(v);if(isNaN(n))return'';if(n>=r[1])return'#6FC36A';if(n>=r[0])return'#F5CB44';return'#EC6A6A'}
// Parst Gewichtsangaben: "25-27" -> 27 (oberer Wert), "25" -> 25, "27,5" -> 27.5
// inv=true (assistierte Uebung): aus einer Spanne zaehlt der KLEINERE Wert,
// weil dort weniger Gegengewicht die bessere Leistung ist ("20-25" -> 20).
function parseWeight(w,inv){
  if(!w&&w!==0)return 0;
  const s=String(w).trim().replace(/,/g,'.');
  if(s.includes('-')){
    const parts=s.split('-').map(x=>parseFloat(x)).filter(n=>!isNaN(n));
    if(!parts.length)return 0;
    return inv?Math.min(...parts):parts[parts.length-1];
  }
  const n=parseFloat(s);
  return isNaN(n)?0:n;
}
// true wenn echte Spanne ("42-45"), false bei Einzelwert ("45") oder "45-45"
function isWeightRange(w){
  if(!w&&w!==0)return false;
  const parts=String(w).trim().replace(/,/g,'.').split('-').map(p=>parseFloat(p)).filter(n=>!isNaN(n));
  return parts.length>=2&&parts[0]!==parts[parts.length-1];
}
// exName wird nur gebraucht um assistierte Uebungen zu erkennen (umgekehrte Richtung).
function prog(cr,pr,cw,pw,exName){
  if(!pr||!pr.length)return null;
  // Keine Auswertung wenn aktuelle Woche noch keine Reps eingetragen
  const crFilled=cr&&cr.filter(v=>v!==''&&v!==undefined&&v!==null&&parseInt(v)>0);
  if(!crFilled||!crFilled.length)return null;
  const prFilled=pr&&pr.filter(v=>v!==''&&v!==undefined&&v!==null&&parseInt(v)>0);
  if(!prFilled||!prFilled.length)return null;
  const inv=isAssist(exName);
  const cu=parseWeight(cw,inv),pu=parseWeight(pw,inv);
  // Gewicht schlaegt Reps: es wird IMMER zuerst das Gewicht verglichen.
  // (cu>0 noetig, damit ein noch leeres Gewichtsfeld nicht faelschlich als Abstieg gilt.)
  // Bei assistierten Uebungen ist die Richtung umgedreht: weniger Gegengewicht = besser.
  if(pu>0&&cu>0){
    const better=inv?(cu<pu):(cu>pu), worse=inv?(cu>pu):(cu<pu);
    if(better)return'w';
    // Die falsche Richtung ist weniger Leistung — auch wenn dabei mehr Reps geschafft wurden.
    if(worse)return'd';
    // Gleicher Bestwert: glatter Einzelwert schlaegt eine Spanne (45 > 42-45, bzw. 20 > 20-25)
    if(!isWeightRange(cw)&&isWeightRange(pw))return'w';
    // Gelockerte Spanne -> kein 'w', weiter zum Rep-Vergleich
  }
  // Reps als DURCHSCHNITT pro ausgefuelltem Satz vergleichen (nicht als Gesamtsumme).
  // So zaehlt 12/15 genauso viel wie 15/12 (Reihenfolge egal) UND unterschiedliche
  // Satz-Anzahlen verfaelschen das Ergebnis nicht mehr: ein zusaetzlicher Satz meldete
  // frueher faelschlich "Mehr Reps", eine erst halb ausgefuellte Woche faelschlich "Weniger".
  const cAvg=crFilled.reduce((a,v)=>a+(parseInt(v)||0),0)/crFilled.length;
  const pAvg=prFilled.reduce((a,v)=>a+(parseInt(v)||0),0)/prFilled.length;
  if(cAvg>pAvg+1e-9)return'r';
  if(cAvg<pAvg-1e-9)return'd';
  return's';
}
function pbadge(p,inv){
  if(!p)return'';
  // Bei assistierten Uebungen heisst Fortschritt WENIGER Gegengewicht — deshalb eigene Labels.
  const m=inv
    ?{w:['↓ Hilfe','var(--prog-up)'],r:['↑ Reps','var(--prog-reps)'],s:['= Gleich','var(--prog-same)'],d:['↑ Hilfe','var(--prog-down)']}
    :{w:['↑ Gewicht','var(--prog-up)'],r:['↑ Reps','var(--prog-reps)'],s:['= Gleich','var(--prog-same)'],d:['↓ Weniger','var(--prog-down)']};
  const[l,c]=m[p]||[];if(!l)return'';
  return'<span class="pbadge" style="background:'+c+'" title="'+(inv?'Gegengewicht der Maschine – weniger ist mehr Leistung':'')+'">'+l+'</span>'
}

function autoExtraSets(di,ei){
  if(S.week<4)return 0;
  let streak=0;
  for(let w=S.week-1;w>=Math.max(1,S.week-3);w--){
    const k=mk(S.cy,w,di,ei),pk=mk(S.cy,w-1,di,ei);
    const cur=S.data[k]||{},prv=S.data[pk]||{};
    // Streak nur wenn dieselbe Uebung wie in der Vorwoche
    if(!cur.exercise||!prv.exercise||cur.exercise!==prv.exercise)break;
    if(!prv.weight&&!(prv.reps||[]).some(Boolean))break;
    // Aktuelle Woche muss Reps haben
    if(!cur.reps||!cur.reps.some(v=>v!==''&&parseInt(v)>0))break;
    const st=prog(cur.reps||[],prv.reps||[],cur.weight,prv.weight,cur.exercise);
    if(st==='s'||st==='d')streak++;else break;
  }
  return streak>=3?1:0;
}


// UEBUNGS-HISTORIE
// Vorwerte haengen an UEBUNG + WIEDERHOLUNGSBEREICH, nicht am Platz im Plan: egal ob die
// Uebung letzte Woche an derselben Stelle stand, an einem anderen Tag, in einem anderen
// Zyklus oder erst vor drei Wochen zuletzt trainiert wurde — es zaehlt immer der letzte
// Eintrag DIESER Uebung IM SELBEN Rep-Bereich. Dieselbe Uebung mit 4-8 und mit 8-12 Reps
// laeuft mit unterschiedlichem Gewicht und wird deshalb strikt getrennt gefuehrt.
// Reihenfolge-Wert eines Eintrags: Zyklus > Woche > Tag > Position am Tag.
function exOrd(cy,w,di,ei){
  const c=parseInt(String(cy).replace(/^p3/,'').replace('cycle',''))||1;
  return c*1e7+w*1e4+di*100+ei;
}
// Rep-Bereich eines Plan-Platzes als String ("4-8"); '' wenn der Platz im Plan nicht existiert
function repRange(pt,di,ei){
  const day=(pt==='p3'?P3:P4)[di];
  const slot=day&&day.e&&day.e[ei];
  return slot&&slot.r?slot.r[0]+'-'+slot.r[1]:'';
}
// Index-Schluessel: Uebung + Rep-Bereich
function exKey(ex,rr){return ex+'||'+rr}
let _exIdx=null; // Cache: Schluessel -> Eintraege (aufsteigend sortiert); save() verwirft ihn
function exIndex(){
  if(_exIdx)return _exIdx;
  const idx={};
  for(const k in S.data){
    const m=/^(p3)?cycle([123])__w(\d+)__d(\d+)__e(\d+)$/.exec(k);
    if(!m)continue;
    const d=S.data[k];
    if(!d||typeof d!=='object'||!d.exercise)continue;
    // Nur Eintraege mit echtem Inhalt (Gewicht oder mindestens eine Wiederholung)
    if(!d.weight&&!((d.reps||[]).some(r=>r!==''&&r!=null)))continue;
    const cy=(m[1]||'')+'cycle'+m[2],w=+m[3],di=+m[4],ei=+m[5],pt=m[1]?'p3':'p4';
    const rr=repRange(pt,di,ei);
    if(!rr)continue; // Platz gibt es im Plan nicht mehr -> kein sinnvoller Vergleich
    const e={pt:pt,cy:cy,w:w,di:di,ei:ei,rr:rr,d:d,ord:exOrd(cy,w,di,ei)};
    const key=exKey(d.exercise,rr);
    (idx[key]=idx[key]||[]).push(e);
  }
  for(const n in idx)idx[n].sort((a,b)=>a.ord-b.ord);
  _exIdx=idx;return idx;
}
// Letzter gespeicherter Wert dieser Uebung im SELBEN Rep-Bereich, VOR der aktuellen Position.
// Sucht im aktuellen Plan ueber alle Zyklen/Wochen/Tage; findet sich dort nichts, wird als
// Rueckfall der letzte Eintrag aus dem anderen Plan (3- bzw. 4-Tage) genommen — nur lesend,
// gespeichert wird weiterhin strikt getrennt.
function findLastExData(di,ei,currentExercise){
  if(!currentExercise)return{};
  const rr=repRange(S.pt,di,ei);
  if(!rr)return{};
  const list=exIndex()[exKey(currentExercise,rr)];
  if(!list||!list.length)return{};
  const cur=exOrd(S.cy,S.week,di,ei);
  let same=null,other=null;
  for(const e of list){
    if(e.pt===S.pt){if(e.ord<cur)same=e}
    else other=e;
  }
  const hit=same||other;
  if(!hit)return{};
  return{...hit.d,_src:{pt:hit.pt,cy:hit.cy,w:hit.w,di:hit.di}};
}
// Kurzlabel woher der Vorwert stammt, z. B. "Z1 W5 · Tag A" (bei anderem Plan zusaetzlich "3-Tage")
function srcLabel(src){
  if(!src)return'';
  const cyN=String(src.cy).replace(/^p3/,'').replace('cycle','');
  const day=((src.pt==='p3'?P3:P4)[src.di]||{}).l||'';
  const dm=/^Tag [A-D]/.exec(day);
  let t='Z'+cyN+' W'+src.w+(dm?' · '+dm[0]:'');
  if(src.pt!==S.pt)t+=' · '+(src.pt==='p3'?'3-Tage':'4-Tage');
  return t;
}
// true wenn Uebung gewaehlt UND alle Saetze der aktuellen Woche Reps haben
function exDone(di,ei){
  const ex=plan()[di].e[ei];
  const k=mk(S.cy,S.week,di,ei);
  const rawCur=S.data[k]||{};
  const pk=S.week>1?mk(S.cy,S.week-1,di,ei):null;
  const prevW=pk?(S.data[pk]||{}):{};
  const exName=rawCur.exercise!==undefined?rawCur.exercise:(prevW.exercise||'');
  if(!exName)return false;
  const xs=rawCur.extraSets!==undefined?rawCur.extraSets:(prevW.extraSets||0);
  const ms=Math.min(5,ex.s+xs+autoExtraSets(di,ei));
  const reps=rawCur.reps||[];
  let filled=0;
  for(let i=0;i<ms;i++){const v=reps[i];if(v!==''&&v!=null&&parseInt(v)>0)filled++}
  return filled>=ms;
}
// Zaehlt die Uebungen der aktuellen Woche, die einen Vorwert UND eingetragene Reps haben,
// und davon die gesteigerten. Nutzt exState — identische Logik wie Badge und Hinweis.
function weekStats(){
  let tot=0,imp=0;
  plan().forEach((d,di)=>d.e.forEach((ex,ei)=>{
    const st=exState(di,ei);
    if(!st.cur.exercise||!st.hasPrev)return;
    if(!st.reps.some(v=>v!==''&&v!=null&&parseInt(v)>0))return;
    tot++;if(st.p==='w'||st.p==='r')imp++;
  }));
  return{tot,imp,pct:tot?Math.round(imp/tot*100):0};
}
// Fortschrittsbalken gezielt im DOM nachziehen (KEIN renderT)
function refreshWeekBar(){
  const box=document.getElementById('wp-box');if(!box)return;
  const w=weekStats();
  box.classList.toggle('hidden',!w.tot);
  const pct=document.getElementById('wp-pct'),bar=document.getElementById('wp-bar'),sub=document.getElementById('wp-sub');
  if(pct)pct.textContent=w.pct+'%';
  if(bar){bar.style.width=w.pct+'%';bar.style.background=w.pct>=100?'var(--green)':'var(--peach)';bar.style.borderRight=(w.pct>0&&w.pct<100)?'2px solid var(--ink)':'none'}
  if(sub)sub.textContent=w.imp+'/'+w.tot+' Übungen gesteigert';

// Badge, Vorwochen-Hinweis, Rep-Feld-Farben und Wochen-Balken LIVE nachziehen.
// Ohne das zeigten sie waehrend der Eingabe noch den Stand von vor der letzten
// Aenderung — z. B. "Gleiche Leistung", obwohl das Gewicht gerade reduziert wurde.
function refreshProg(di,ei){
  const st=exState(di,ei);
  const b=document.getElementById('pb-'+di+'-'+ei);
  if(b)b.innerHTML=pbadge(st.p,st.inv);
  const hb=document.getElementById('ph-'+di+'-'+ei);
  if(hb)hb.innerHTML=hintHTML(st);
  for(let i=0;i<st.ms;i++){
    const el=document.getElementById('rp-'+di+'-'+ei+'-'+i);
    if(el)el.style.background=rcol(st.reps[i],st.ex.r)||'var(--field-bg)';
  }
  refreshWeekBar();
}
// Aktualisiert Tages-Pill + Erledigt-Haken gezielt im DOM (KEIN renderT — Fokus bleibt erhalten)
function refreshDone(di,ei){
  const chip=document.getElementById('done-'+di+'-'+ei);
  if(chip)chip.classList.toggle('hidden',!exDone(di,ei));
  const day=plan()[di];const total=day.e.length;
  let done=0;day.e.forEach((ex,i)=>{if(exDone(di,i))done++});
  const el=document.getElementById('dc-'+di);
  if(el){
    el.textContent=(done===total?'✓ ':'')+done+'/'+total+' Übungen';
  }
}
// Zustand einer Uebungszeile an EINER Stelle berechnet — genutzt von renderEx (Aufbau),
// refreshProg (Live-Update ohne renderT) und weekStats (Fortschrittsbalken). So koennen
// Badge, Hinweis und Balken nicht mehr auseinanderlaufen.
function exState(di,ei){
  const ex=plan()[di].e[ei];
  const k=mk(S.cy,S.week,di,ei),pk=S.week>1?mk(S.cy,S.week-1,di,ei):null;
  const rawCur=S.data[k]||{},prevWeekData=pk?(S.data[pk]||{}):{};
  // Übung + extraSets aus Vorwoche übernehmen wenn aktuelle Woche noch leer
  const cur={
    ...rawCur,
    exercise: rawCur.exercise!==undefined ? rawCur.exercise : (prevWeekData.exercise||''),
    extraSets: rawCur.extraSets!==undefined ? rawCur.extraSets : (prevWeekData.extraSets||0),
  };
  // Vergleichswert: letzter gespeicherter Wert DIESER Uebung (nicht einfach Vorwoche)
  const prv=findLastExData(di,ei,cur.exercise);
  const autoX=autoExtraSets(di,ei);
  const ms=Math.min(5,ex.s+(cur.extraSets||0)+autoX);
  // NUR die Saetze der aktuellen Woche: ein spaeter entfernter Zusatzsatz darf nicht
  // als Rest im Vergleich haengen bleiben (sonst zaehlt eine geloeschte Zahl weiter mit).
  const reps=(cur.reps||[]).slice(0,ms);
  const hasPrev=!!(prv.weight||(prv.reps||[]).some(r=>r!==''&&r!=null));
  return {ex,cur,prv,ms,autoX,reps,hasPrev,inv:isAssist(cur.exercise),
    p:prog(reps,prv.reps||[],cur.weight,prv.weight,cur.exercise),
    srcL:hasPrev?srcLabel(prv._src):''};
}
// Vorwochen-Hinweis ("VW: 17 kg · 12 / 12 Wdh … → Gleiche Leistung!")
function hintHTML(st){
  if(!(st.hasPrev&&st.prv.weight))return'';
  const inv=st.inv,p=st.p;
  const cu=parseWeight(st.cur.weight,inv),pu=parseWeight(st.prv.weight,inv);
  // Bei 'd' unterscheiden, ob das Gewicht die falsche Richtung ging — sonst bleibt unklar warum
  const wWorse=cu>0&&pu>0&&(inv?cu>pu:cu<pu);
  const dTxt=wWorse?(inv?'→ Mehr Gegengewicht – kein Problem!':'→ Weniger Gewicht – kein Problem!'):'→ Kein Problem!';
  const wTxt=inv?'→ Weniger Gegengewicht – stärker geworden! ✓':'→ Gewicht gesteigert! ✓';
  const pm=p==='w'?' <span style="color:var(--green)">'+wTxt+'</span>':p==='r'?' <span style="color:var(--blue)">→ Mehr Wiederholungen! ✓</span>':p==='s'?' <span style="color:var(--gold)">→ Gleiche Leistung!</span>':p==='d'?' <span style="color:var(--red)">'+dTxt+'</span>':'';
  const sl=st.srcL?' <span style="opacity:.75">('+esc(st.srcL)+')</span>':'';
  return '<div class="phint">VW: '+esc(st.prv.weight)+' kg '+(inv?'Hilfe ':'')+'· '+esc((st.prv.reps||[]).filter(Boolean).join(' / '))+' Wdh'+sl+pm+'</div>';
}
function renderEx(ex,ei,di){

  // tips: Standard-Tipp wird IMMER angezeigt, eigene Texte als Notiz zusaetzlich darunter

  let rh='';

    +'<span id="pb-'+di+'-'+ei+'" style="display:contents">'+pbadge(p,st.inv)+'</span>'+doneChip+'</div>'
    +'<div class="ex-meta"><span class="sets-info">'+ms+' Sätze · <span style="color:var(--text)">'+ex.r[0]+'–'+ex.r[1]+' Reps</span>'+autoLabel+'</span>'
    +'<div class="w-wrap"><span class="w-label"'+(st.inv?' title="Gegengewicht der Maschine – weniger Hilfe bedeutet mehr eigene Kraft"':'')+'>'+(st.inv?'Hilfe:':'Gewicht:')+'</span><input class="w-input" type="text" value="'+esc(cur.weight||'')+'" placeholder="kg" onchange="updW('+di+','+ei+',this.value)"/>'+(prv.weight?'<span style="color:var(--text-faint);font-size:11px" title="Letzter Eintrag dieser Übung'+(srcL?': '+esc(srcL):'')+'">(VW: '+esc(prv.weight)+')</span>':'')+'</div></div>'
    +setH
    +'<div class="reps-row">'+rh+'</div>'+hint+tipH+'</div>';
}

function renderOv(){
  const pl=plan();let h='<h2 class="ov-title">Fortschritts-Übersicht</h2><p class="ov-sub">Gewichtsentwicklung pro Übung über alle 12 Wochen.</p>';
  pl.forEach((day,di)=>{
    const dcol=DAYBG[di%4];
    h+='<div class="ov-day"><div class="ov-day-lbl" style="background:'+dcol+'">'+esc(day.l)+'</div>';
    day.e.forEach((ex,ei)=>{
      const ws=Array.from({length:12},(_,i)=>{const d=S.data[mk(S.cy,i+1,di,ei)]||{};return{w:i+1,name:d.exercise||'',wt:parseWeight(d.weight,isAssist(d.exercise))||0}});
      const filled=ws.filter(x=>x.wt>0),nums=ws.map(x=>x.wt),mx=Math.max(...nums,1);
      // Angezeigt wird die ZULETZT trainierte Uebung dieses Platzes. Wurde die Uebung
      // im Zyklus gewechselt, darf der kg-Zugewinn NICHT ueber beide Uebungen gerechnet
      // werden (60 kg Langhantel -> 100 kg Maschine sind keine +40 kg Fortschritt).
      const name=filled.length?filled[filled.length-1].name:((ws.find(x=>x.name)||{}).name||'');
      const usedNames=[...new Set(filled.map(x=>x.name).filter(Boolean))];
      const sameEx=name?filled.filter(x=>x.name===name):filled;
      // Assistierte Uebung: Fortschritt heisst WENIGER Gegengewicht, also dreht sich
      // sowohl die kg-Bilanz als auch die Balkenhoehe um (niedrige Hilfe = hoher Balken).
      const inv=isAssist(name);
      const mn=filled.length?Math.min(...filled.map(x=>x.wt)):0;
      const score=v=>inv?(mx+mn-v):v;
      const col=CC[ex.c]||'#aaa';
      const gain=sameEx.length>=2?(inv?sameEx[0].wt-sameEx[sameEx.length-1].wt:sameEx[sameEx.length-1].wt-sameEx[0].wt):null;
      const gainTxt=gain&&gain>0?(inv?'−'+gain.toFixed(1)+' kg Hilfe':'+'+gain.toFixed(1)+' kg'):'';
      // Hinweiszeile UNTER den Balken (auf dem iPhone gibt es keinen Hover-Tooltip)
      const prevNames=usedNames.filter(n=>n!==name);
      const swapNote=(prevNames.length?'<div style="font-size:10px;color:var(--text-faint);margin-top:3px">Davor hier: '+esc(prevNames.join(', '))+' (grau) – nicht mit eingerechnet</div>':'')
        +(inv&&filled.length?'<div style="font-size:10px;color:var(--text-faint);margin-top:3px">Gegengewicht der Maschine – weniger Hilfe = mehr Kraft (höherer Balken)</div>':'');
      const bars=nums.map((v,i)=>{
        const isCur=(i+1)===S.week;
        const other=!!(ws[i].name&&name&&ws[i].name!==name);
        const fillCol=other?'var(--text-ghost)':(isCur?'var(--peach)':'var(--lilac)');
        const hPct=v>0?Math.max(8,Math.round(score(v)/mx*100)):0;
        return '<div class="ov-bar" title="W'+(i+1)+': '+(v||'–')+(inv?' kg Hilfe':' kg')+(ws[i].name?' · '+ws[i].name:'')+'"><div class="ov-bar-fill" style="height:'+hPct+'%;background:'+(v>0?fillCol:'transparent')+'"></div></div>';
      }).join('');
      h+='<div class="ov-ex"><div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px"><span style="font-weight:700;color:var(--text)">'+(name?esc(name):'<span style="color:var(--text-faint)">—</span>')+'</span><div style="display:flex;gap:12px;align-items:center"><span style="color:var(--text-mid);font-size:11px">'+esc(ex.c)+'</span>'+(gainTxt?'<span style="color:var(--green);font-weight:700">'+gainTxt+'</span>':'')+'</div></div><div class="ov-bars">'+bars+'</div><div style="display:flex;justify-content:space-between;margin-top:4px"><span style="font-size:10px;color:var(--text-faint)">W1</span><span style="font-size:10px;color:var(--text-faint)">W12</span></div>'+(sameEx.length?'<div style="font-size:11px;color:var(--text-dim);margin-top:4px">Start: <b style="color:var(--text)">'+sameEx[0].wt+' kg</b>'+(sameEx.length>1?' · Aktuell: <b style="color:var(--green)">'+sameEx[sameEx.length-1].wt+' kg</b>':'')+'</div>':'')+swapNote+'</div>';
    });
    h+='</div>';
  });
  // Daten-Backup: Export/Import der kompletten Trainingsdaten (Geraete-/Icon-Wechsel, Sicherung)
  h+='<div class="bk-card">'
    +'<div class="bk-title">💾 Daten-Backup</div>'
    +'<p class="bk-sub">Sichere deine Trainingsdaten oder übertrage sie auf ein anderes Gerät oder Icon. <b>Kopieren</b> legt alles in die Zwischenablage – dann in der anderen Version unten einfügen und <b>einspielen</b>.</p>'
    +'<button class="bk-btn nb-shadow" onclick="expBackup()">Backup kopieren</button>'
    +'<span class="bk-status" id="bk-status"></span>'
    +'<textarea class="bk-ta" id="bk-ta" rows="3" placeholder="Backup-Text hier einfügen (Feld gedrückt halten → Einfügen / Pegar) …"></textarea>'
    +'<button class="bk-btn bk-imp nb-shadow" onclick="impBackup()">Backup einspielen</button>'
    +'</div>';
  document.getElementById('view-overview').innerHTML=h;
}

// BACKUP
function bkMsg(t){const s=document.getElementById('bk-status');if(s)s.textContent=t}
function expBackup(){
  const payload=JSON.stringify({app:'peach',v:1,date:new Date().toISOString().slice(0,10),data:S.data});
  const fallback=()=>{const ta=document.getElementById('bk-ta');if(ta){ta.value=payload;ta.focus();ta.select()}bkMsg('Kopieren blockiert – Text unten ist markiert, bitte manuell kopieren.')};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(payload).then(()=>bkMsg('✓ Kopiert ('+Object.keys(S.data).length+' Einträge)! Jetzt in der anderen Version einfügen.')).catch(fallback);
  }else fallback();
}
function impBackup(){
  const ta=document.getElementById('bk-ta');
  if(!ta||!ta.value.trim()){bkMsg('Bitte zuerst den kopierten Backup-Text in das Feld einfügen.');return}
  let p;
  try{p=JSON.parse(ta.value.trim())}catch{bkMsg('Das sieht nicht wie ein Backup aus – bitte den kompletten kopierten Text einfügen.');return}
  const data=p&&p.app==='peach'&&p.data?p.data:(p&&typeof p==='object'&&!Array.isArray(p)?p:null);
  const looksValid=data&&Object.keys(data).some(k=>/__w\d+__d\d+__e\d+/.test(k)||k.indexOf('tip__')===0||k.indexOf('set__')===0);
  if(!looksValid){bkMsg('Backup ist leer oder ungültig – bitte den Text aus "Backup kopieren" verwenden.');return}
  const n=Object.keys(data).length,have=Object.keys(S.data).length;
  if(have>0&&!confirm('Achtung: Hier sind bereits '+have+' Einträge gespeichert. Wirklich mit dem Backup ('+n+' Einträge) überschreiben?'))return;
  S.data=data;save();
  render();
  bkMsg('✓ Backup eingespielt – '+n+' Einträge wiederhergestellt!');
}

// ACTIONS
// Sanfter Einblend-Effekt fuer die aktive Ansicht (Tab-/Zyklus-/Wochen-Wechsel)
function flashView(){
  const el=document.getElementById('view-'+S.view);
  if(el){el.classList.remove('fade-in');void el.offsetWidth;el.classList.add('fade-in')}
}
function setView(v){S.view=v;saveUI();render();flashView()}
// Plan-Wechsel 3/4 Tage: Zyklus-Nummer bleibt, Daten-Keys sind pro Plan getrennt (p3-Praefix)
function setPlan(pt){if(S.pt===pt)return;S.pt=pt;S.cy=(pt==='p3'?'p3':'')+cyBase();S.openDays={};S.drop=null;saveUI();render();flashView()}
function setCycle(c){S.cy=(S.pt==='p3'?'p3':'')+c;saveUI();render();flashView()}
function changeWeek(d){const old=S.week;S.week=Math.max(1,Math.min(12,S.week+d));saveUI();render();if(S.week!==old)flashView()}
function toggleDay(di){const wasOpen=S.openDays[di]===true;S.openDays={};if(!wasOpen){S.openDays[di]=true;S.animDay=di}saveUI();render()}

function togDrop(di,ei,ev){
  ev.stopPropagation();
  if(S.drop&&S.drop.di===di&&S.drop.ei===ei){S.drop=null}else{S.drop={di,ei};S.dropSearch='';S.dropAnim=true}
  renderT();
  S.dropAnim=false;
  if(S.drop){setTimeout(()=>{
    const el=document.getElementById('ds-'+di+'-'+ei);
    if(el)el.focus();
    const dd=document.getElementById('dd-'+di+'-'+ei);
    const pw=document.getElementById('pw-'+di+'-'+ei);
    if(dd&&pw){const r=pw.getBoundingClientRect();if(window.innerHeight-r.bottom<280){dd.style.bottom='calc(100% + 4px)';dd.style.top='auto'}}
  },20)}
}
function onDS(di,ei,v){
  S.dropSearch=v;renderT();
  // Fokus + Cursor wiederherstellen, da renderT() das Eingabefeld neu aufbaut
  const el=document.getElementById('ds-'+di+'-'+ei);
  if(el){el.focus();const n=el.value.length;el.setSelectionRange(n,n)}
}
// Tastatur-Navigation im Picker-Suchfeld: Pfeile bewegen das Highlight (.hl),
// Enter waehlt die markierte Option, Esc schliesst. Suche setzt das Highlight zurueck (renderT).
function dsKey(di,ei,e){
  const dd=document.getElementById('dd-'+di+'-'+ei);
  if(!dd)return;
  // Die Zeile "– Übung wählen –" ist bewusst NICHT Teil der Pfeil-Navigation: sonst
  // landete der erste Pfeil-runter darauf und Enter LOESCHTE die Uebung statt zu waehlen.
  const opts=[...dd.querySelectorAll('.drop-opt:not(.drop-empty-opt)')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    if(!opts.length)return;
    let i=opts.findIndex(o=>o.classList.contains('hl'));
    i=e.key==='ArrowDown'?Math.min(i+1,opts.length-1):Math.max(i-1,0);
    opts.forEach(o=>o.classList.remove('hl'));
    opts[i].classList.add('hl');
    opts[i].scrollIntoView({block:'nearest'});
  }else if(e.key==='Enter'){
    e.preventDefault();
    // Ohne Markierung: bei genau einem Treffer diesen nehmen
    const cur=dd.querySelector('.drop-opt.hl:not(.drop-empty-opt)')||(opts.length===1?opts[0]:null);
    if(cur)cur.click();
  }else if(e.key==='Escape'){
    e.preventDefault();
    S.drop=null;S.dropSearch='';renderT();
  }
}
function selEx(di,ei,v){
  const k=initKey(di,ei);
  S.data[k]={...S.data[k],exercise:v};save();
  S.drop=null;S.dropSearch='';renderT();
}
function initKey(di,ei){
  const k=mk(S.cy,S.week,di,ei);
  if(!S.data[k]){
    const pk=S.week>1?mk(S.cy,S.week-1,di,ei):null;
    const prv=pk?(S.data[pk]||{}):{};
    S.data[k]={exercise:prv.exercise||'',extraSets:prv.extraSets||0};
  }
  return k;
}
function updW(di,ei,v){const k=initKey(di,ei);S.data[k]={...S.data[k],weight:v};save();refreshProg(di,ei)}
// Maschinen-Einstellung speichern — uebungsbasiert, KEIN renderT (Fokus bleibt erhalten)
function updSetting(di,ei,v){
  const k=mk(S.cy,S.week,di,ei),pk=S.week>1?mk(S.cy,S.week-1,di,ei):null;
  const rawCur=S.data[k]||{},prevW=pk?(S.data[pk]||{}):{};
  const ex=rawCur.exercise!==undefined?rawCur.exercise:(prevW.exercise||'');
  if(!ex)return;
  const key='set__ex__'+ex;
  if(String(v).trim()==='')delete S.data[key];else S.data[key]=v;
  save();
}
function updRep(di,ei,i,v){
  const k=initKey(di,ei);const cur=S.data[k];
  const r=[...(cur.reps||[])];while(r.length<=i)r.push('');r[i]=v;
  S.data[k]={...cur,reps:r};save();
  refreshDone(di,ei);refreshProg(di,ei);
}
function addSet(di,ei){const k=initKey(di,ei);S.data[k]={...S.data[k],extraSets:(S.data[k].extraSets||0)+1};save();renderT()}
function removeSet(di,ei){const k=initKey(di,ei);S.data[k]={...S.data[k],extraSets:Math.max(0,(S.data[k].extraSets||0)-1)};save();renderT()}
function togTip(tk){S.tips[tk]=!S.tips[tk];if(!S.tips[tk])S.tipEdit[tk]=false;renderT()}
function edTip(tk){S.tipEdit[tk]=true;renderT()}
function canTip(tk){S.tipEdit[tk]=false;renderT()}
function savTip(tk,tid,sk){const el=document.getElementById(tid);if(el){if(el.value.trim()==='')delete S.data[tk];else S.data[tk]=el.value;save()}S.tipEdit[sk]=false;renderT()}
function resTip(tk,sk){delete S.data[tk];save();S.tipEdit[sk]=false;renderT()}

document.addEventListener('click',e=>{
  if(S.drop&&!e.target.closest('.picker-wrap')){S.drop=null;renderT()}
});

// AUTO-UPDATE: iOS-Webapp-Cache-Problem. Beim Oeffnen wird per GitHub-API geprueft,
// ob auf main ein neuerer Commit liegt als diese Datei (BUILD_TS). Wenn ja, laedt die
// App sich EINMAL selbst neu - mit ?v=sha am Cache vorbei. peach_ver merkt sich den
// Commit, fuer den schon neu geladen wurde (verhindert Reload-Schleifen). Daten in
// peach_v4 sind davon voellig unberuehrt. BUILD_TS bei jedem Deploy aktualisieren!
const BUILD_TS='2026-08-15T07:12:00Z';
let verLastCheck=0;
function checkUpdate(){
  const now=Date.now();
  if(now-verLastCheck<60000)return;
  verLastCheck=now;
  try{
    fetch('https://api.github.com/repos/nicolehahn2890/Trainingsapp/commits/main',{cache:'no-store'})
      .then(r=>r&&r.ok?r.json():null)
      .then(j=>{
        if(!j||!j.sha||!j.commit||!j.commit.committer)return;
        const remoteDate=j.commit.committer.date;
        if(!(remoteDate>BUILD_TS))return; // diese Version ist aktuell
        let guard=null;
        try{guard=localStorage.getItem('peach_ver')}catch{}
        if(guard===j.sha)return; // fuer diesen Commit wurde schon neu geladen
        try{localStorage.setItem('peach_ver',j.sha)}catch{}
        location.replace(location.pathname+'?v='+j.sha.slice(0,8));
      }).catch(()=>{});
  }catch{}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});

render();
checkUpdate();
</script>
